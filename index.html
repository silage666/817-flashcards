> 简答题｜请分点写出踩分关键词。","answer":"不分流向、分流向、转向（交叉口）、分车种、车辆占用、行人、境界出入、分隔查核线、特定地点或专项","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-040","question":"**地点车速调查的时间与样本量**\n\n> 简答题｜请分点写出踩分关键词。","answer":"天气良好、交通正常；一般性调查选非高峰（国外9:00-17:00等）；样本至少50辆、最好100辆以上；避免只取车队首车或某一车种","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-041","question":"**区间速度调查方法**\n\n> 简答题｜请分点写出踩分关键词。","answer":"牌照法（起终点记车牌后三位，适用中途无交叉口、出入口、停车；需秒表同步）；流动车法；跟车法（测路段长度、记录沿线情况，省人力但受试验车性能与驾驶习惯影响）","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-042","question":"**地面高处摄影法**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"高处架摄像机，路段长50~100m；逐画面读路段内车辆数K_i，总观测时间T；观测5min以上可消除偶然性\n\n**核心公式**\n\n$$K=\\frac{\\sum_i K_i}{nL},\\qquad n=\\frac{T}{\\Delta t}$$","chapter":"第3章","starLevel":"★★★★☆","cardType":"计算","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-043","question":"**引道延误各指标关系**\n\n> 简答题｜请分点写出踩分关键词。","answer":"停车延误约占引道延误76%，排队延误约占97%；实际常以排队延误近似代替引道延误","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-044","question":"**输出-输入法**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"仅用于瓶颈路段拥堵、到达率与离去率均一；两端设观测员、5或15min累计；绘到达-离去曲线，围成面积=受阻车辆总车时D_a；再求无阻塞每车所需时间t_n与平均行程时间T_s\n\n**核心公式**\n\n$$d_s=\\frac{D_a}{Q}$$","chapter":"第3章","starLevel":"★★★★☆","cardType":"计算","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-045","question":"**引道延误最小样本量**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"S为样本标准差(10~20s)、E为容许误差(2~5s)；不少于30辆、观测60辆效果较好\n\n**核心公式**\n\n$$N\\geq\\left(\\frac{SK}{E}\\right)^2$$","chapter":"第3章","starLevel":"★★★★☆","cardType":"计算","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-046","question":"**停车百分比最小样本量**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"p为停车百分比、d为容许误差(常0.05)、K为置信度常数(95%时1.96)；不少于50辆；事后反算容许误差\n\n**核心公式**\n\n$$N\\geq\\frac{(1-p)K^2}{pd^2}$$","chapter":"第3章","starLevel":"★★★★☆","cardType":"计算","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-047","question":"**路段车头时距调查**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"选平坡直线、不受交叉口与行人影响；连续车队、分车型测车头时距并测地点车速；剔除异常值（h在均值±2s内）；算平均车头时距与换算系数\n\n**核心公式**\n\n$$\\bar h=\\frac{\\sum_i h_i}{n}\\quad(\\text{异常值剔除区间：}\\bar h\\pm2\\text{s})$$","chapter":"第3章","starLevel":"★★★★☆","cardType":"计算","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-048","question":"**车辆换算系数**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"以小汽车为标准车；中车、大车换算系数按车头时距比确定\n\n**核心公式**\n\n$$a_{\\text{中}}=\\frac{\\bar h_{\\text{中}}}{\\bar h_{\\text{小}}},\\qquad a_{\\text{大}}=\\frac{\\bar h_{\\text{大}}}{\\bar h_{\\text{小}}}$$","chapter":"第3章","starLevel":"★★★★☆","cardType":"计算","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-049","question":"**信号交叉口穿越空档调查**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"测直行车到冲突点时间t1与车型、左转车到冲突点t2、左转后直行车到冲突点t3；前档t_f、后档t_r、总时长t\n\n**核心公式**\n\n$$t_f=t_2-t_1,\\qquad t_r=t_3-t_2,\\qquad t=t_f+t_r=t_3-t_1$$","chapter":"第3章","starLevel":"★★★★☆","cardType":"计算","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-050","question":"**饱和流量的测定方法**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"方法一：定时信号0.1min单元统计，去首末间隔；方法二：非定周期测三个时间间隔，用饱和流率公式；方法三：测车头时距，3600s除以平均车头时距，混合车需换算\n\n**核心公式**\n\n$$s^*=\\frac{x_2}{x_4-10n_4}$$","chapter":"第3章","starLevel":"★★★★☆","cardType":"计算","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-051","question":"**境内出行/过境出行**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"境内：起讫点均在调查区域内；过境：起讫点均在调查区域外","chapter":"第3章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-052","question evel":"★★★★☆","cardType":"简答","planDay":"D3","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-063","question":"**机械计数法**\n\n> 简答题｜请分点写出踩分关键词。","answer":"连续调查、节省人力、使用方便、范围广、精度较高；一次性投资大、使用率不高、对项目适应性差","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-064","question":"**微波检测器**\n\n> 简答题｜请分点写出踩分关键词。","answer":"雷达波发射接收设备+控制器+调制解调+专用电源；反射雷达波检测车辆；易安装养护、多车道、受环境影响小；用于高速公路交通管理","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-065","question":"**手机信令切换的数据采集**\n\n> 简答题｜请分点写出踩分关键词。","answer":"手机与基站小区边界切换→记录切换信息→算法获取车速；流程：数据获取→路网标定→道路匹配→车速计算","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-066","question":"**基于手机数据的OD调查**\n\n> 简答题｜请分点写出踩分关键词。","answer":"原始数据分手单数据与信令数据；位置基本单元为蜂窝小区；以手机用户为传感器、由基站切换序列反推轨迹；小区划分与匹配→OD矩阵","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-067","question":"**交通量调查的目的与用途**\n\n> 简答题｜请分点写出踩分关键词。","answer":"年交通量（预测趋势、估年收益）；日平均/年平均日交通量（衡量需求、定改造计划）；小时交通量（高峰、通行能力缺口、信号配时）；短时流量（扩为小时交通量）","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-068","question":"**交通量调查时间的选择**\n\n> 简答题｜请分点写出踩分关键词。","answer":"常年观测（365d、24h）；抽样观测；部分时间换算全天（16h/12h）；高峰小时（含高峰连续3h）；记录时段一般15min、一次不少于1h","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-069","question":"**交叉口交通量调查**\n\n> 简答题｜请分点写出踩分关键词。","answer":"人工观测，每进口至少1人，选高峰最大时刻；进出口车辆数比较误差≤5%；环形/多路交叉需在各进口道与环道设点；可用牌照法","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-070","question":"**地点车速调查的观测地点**\n\n> 简答题｜请分点写出踩分关键词。","answer":"选交叉口之间、地形平直、间距大、无干扰路段；避开公交站与人行过街","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-071","question":"**人工量测车速（划线量测）**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"按平均速度选路段长度，记录时间≥1.5s，计时平均2~2.5s；长度取0.27778m的n倍；车速v=n/t\n\n**核心公式**\n\n$$v=\\frac{n}{t}\\quad(n\\text{为}0.27778\\text{m的倍数，}t\\text{单位为s})$$","chapter":"第3章","starLevel":"★★★★☆","cardType":"计算","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-072","question":"**跟车法平均极差**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"按规定的容许误差与行驶车速平均极差确定最小样本量\n\n**核心公式**\n\n$$R=\\frac{\\sum_{i=1}^{N}|s_i|}{N-1}$$","chapter":"第3章","starLevel":"★★★★☆","cardType":"计算","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-073","question":"**行车延误调查的应用**\n\n> 简答题｜请分点写出踩分关键词。","answer":"评价拥堵程度；探求延误发展趋势；评价服务质量；作为道路改建依据；用于运输规划、经济分析、设施改善效果分析、交通管制","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-074","question":"**跟车法调查延误**\n\n> 简答题｜请分点写出踩分关键词。","answer":"两名观测员两块秒表；驶过起点启动表1、停车缓行启动表2、恢复正常表2回零、到终点停表1；需先定路线长度与控制点距离","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-075","question":"**交叉口延误调查地点与时间**\n\n> 简答题｜请分点写出踩分关键词。","answer":"常堵交叉口；部分入口堵只查该方向，评价整体则各方向同时；选高峰时段，对比时两次条件相似","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-076","question":"**引道延误调查**\n\n> 简答题｜请分点写出踩分关键词。","answer":"引道延误=引道时间−畅行通过时间；简便易行、人员不紧张、可得延误分布与各流向延误；缺点是不能获得每车平均延误与停车百分比","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-077","question":"**出行分布**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"调查区域内各交通小区之间的车、人出行次数","chapter":"第3章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-078","question":"**OD调查的目的**\n\n> 简答题｜请分点写出踩分关键词。","answer":"模拟现状出行、为改善路网功能与工程排序提供依据；建立交通预测模型；分析出行特征、提高公交效率与制定政策","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-079","question":"**OD调查的类别**\n\n> 简答题｜请分点写出踩分关键词。","answer":"个人出行（目的、方式、时间、距离、起讫点）；车辆出行（车型、营业特点、装载、目的）；货物流通出行（集散点、种类、运量、运输方式）","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M03-080","question":"**OD调查方法（新型）**\n\n> 简答题｜请分点写出踩分关键词。","answer":"互联网方式（二维码、APP小程序、网络链接）；基于手机数据的OD调查","chapter":"第3章","starLevel":"★★★★☆","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-081","question":"**连续流设施**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"无外部因素使交通流周期性中断的设施，如高速公路、限制出入口路段、乡村公路重要交叉口间较长路段；车流模式由土地利用衍生的行程控制","chapter":"第4章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-082","question":"**间断流设施**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"因外部设备导致交通流周期性中断的设施，如信号、停车或让路标志；车流成队行进；信号标志间隔3~2km以上可能形成连续流","chapter":"第4章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-083","question":"**流量—速度关系**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"把密度表达式代入基本关系式，流量与速度亦为抛物线关系\n\n**核心公式**\n\n$$Q=K_j\\left(V-\\frac{V^2}{V_f}\\right)$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-084","question":"**瓶颈处交通流分析**\n\n> 简答题｜请分点写出踩分关键词。","answer":"上游到达量超过下游通行能力即产生排队；绘到达与离开累计曲线，t₁形成、t₂最长、t₃消散，总延误=两曲线间面积","chapter":"第4章","starLevel":"★★★★☆","cardType":"简答","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-085","question":"**信号间断处车流特征**\n\n> 简答题｜请分点写出踩分关键词。","answer":"车队通过信号交叉口时车头时距从第一辆起逐渐减小，一般在第4至第6车头时距之间趋于一致","chapter":"第4章","starLevel":"★★★★☆","cardType":"简答","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-086","question":"**延误（间断流服务水平指标）**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"分停车延误与运行延误；停车延误指等待横穿道路的停车总时间，运行延误指理想运行时间与实际运行时间之差","chapter":"第4章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-087","question":"**引道延误与停车延误的关系**\n\n> 简答题｜请分点写出踩分关键词。","answer":"信号交叉口还有引道延误，约为停车延误的1.3倍（等价于停车延误约占引道延误76%）","chapter":"第4章","starLevel":"★★★★☆","cardType":"简答","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-088","question":"**GM跟驰模型**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"后车加速度与前车相对速度成正比、与车头间距的l次方成反比，含m、l、c三个参数\n\n**核心公式**\n\n$$a_n(t)=\\frac{c[v_n(t)]^m[v_{n-1}(t-T)-v_n(t-T)]}{[x_{n-1}(t-T)-x_n(t-T)]^l}$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-089","question":"**智能驾驶员模型IDM**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"考虑期望速度、期望间距与速度差多因素，参数物理意义明确、易标定、应用广泛\n\n**核心公式**\n\n$$a_n=a\\left[1-\\left(\\frac{v_n}{v_0}\\right)^\\delta-\\left(\\frac{s^*(v_n,\\Delta v_n)}{s_n}\\right)^2\\right],\\qquad s^*=s_0+v_nT+\\frac{v_n\\Delta v_n}{2\\sqrt{ab}}$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-090","question":"**行波解与波速**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"密度在特征线上不随时间改变，解为x=Q'(k)t+C₀，波速等于流量对密度的导数（流量—密度曲线切线斜率）\n\n**核心公式**\n\n$$\\mu=Q'(k)$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-091","question":"**二项分布**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"车流拥挤、自由行驶机会少时适用；由均值m与方差S²反估参数\n\n**核心公式**\n\n$$P(k)=C_n^k p^k(1-p)^{n-k},\\qquad p=\\frac{m-S^2}{m},\\quad n=\\frac{m^2}{m-S^2}$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-092","question":"**移位负指数分布**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"考虑最小车头时距τ；适用于不能超车的单列车流和车流率低的情况\n\n**核心公式**\n\n$$P(h\\geq t)=e^{-\\lambda(t-\\tau)}\\ (t\\geq\\tau),\\qquad \\bar h=\\frac{1}{\\lambda}+\\tau$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-093","question":"**排队与排队系统**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"排队指等待服务的顾客（不含正在服务的）；排队系统包括等待服务和正在被服务的顾客","chapter":"第4章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-094","question":"**排队系统的三个组成部分**\n\n> 简答题｜请分点写出踩分关键词。","answer":"输入过程（定长、泊松、爱尔朗）、排队规则（损失制、等待制、混合制）、服务方式（定长、负指数、爱尔朗）；M/D/E_k记号","chapter":"第4章","starLevel":"★★★★☆","cardType":"简答","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-095","question":"**排队系统的主要数量指标**\n\n> 简答题｜请分点写出踩分关键词。","answer":"等待时间（到达至开始服务）、忙期（服务台连续繁忙时期）、队长（含排队与系统中顾客数）","chapter":"第4章","starLevel":"★★★★☆","cardType":"简答","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-096","question":"**M/M/N系统**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"多通道服务；单路排队多通道时须先求无顾客概率P(0)\n\n**核心公式**\n\n$$\\rho=\\frac{\\lambda}{N\\mu}<1,\\quad P_0=\\left[\\sum_{k=0}^{N-1}\\frac{(N\\rho)^k}{k!}+\\frac{(N\\rho)^N}{N!(1-\\rho)}\\right]^{-1}$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-097","question":"**路段效用函数（BPR）**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"路段出行时间随流量增加而增加；流量为0时为自由流时间\n\n**核心公式**\n\n$$t(v)=t_0\\left[1+\\alpha\\left(\\frac{v}{C}\\right)^\\beta\\right]$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-098","question":"**格林柏对数模型**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"速度与密度呈对数关系，适用于交通密度较大的情况\n\n**核心公式**\n\n$$V=V_m\\ln\\left(\\frac{K_j}{K}\\right)$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-099","question":"**安德伍德指数模型**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"速度随密度指数衰减，适用于密度较小的情况\n\n**核心公式**\n\n$$V=V_fe^{-K/K_m}$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-100","question":"**拥挤的类型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"周期性拥挤（同一地点时间重复出现）与非周期性拥挤（偶然事件造成，通常不可预报）","chapter":"第4章","starLevel":"★★★★☆","cardType":"简答","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-101","question":"**起动损失时间**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"前几辆车消耗大于饱和车头时距的时间总和\n\n**核心公式**\n\n$$l_1=\\sum_i t_i$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-102","question":"**净损失时间**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"最后一辆车离开引道进入交叉口到绿灯信号再次开始的时间","chapter":"第4章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-103","question":"**优化速度模型OVM**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"以优化速度函数表达期望车速，采用加速度表达式便于仿真\n\n**核心公式**\n\n$$a_n(t)=\\alpha\\left[V(\\Delta x_n(t))-v_n(t)\\right]$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-104","question":"**全速度差模型FVDM**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"在OVM基础上加入速度差项，模拟实际跟驰行为效果理想\n\n**核心公式**\n\n$$a_n(t)=\\alpha\\left[V(\\Delta x_n(t))-v_n(t)\\right]+\\lambda\\Delta v_n(t)$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-105","question":"**技术改变跟驰特性的五个方面**\n\n> 简答题｜请分点写出踩分关键词。","answer":"扩大感知范围与信息量；减少人工驾驶任务；保持更短车头时距提高效率；反应更快提高安全；运行更稳定减少排放","chapter":"第4章","starLevel":"★★★★☆","cardType":"简答","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-106","question":"**车流波动理论的应用**\n\n> 简答题｜请分点写出踩分关键词。","answer":"分析货车对上游交通状态影响的持续时间、比较不同事故处理方案下的排队长度；解题需画基本图与波速示意图","chapter":"第4章","starLevel":"★★★★☆","cardType":"简答","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-107","question":"**负二项分布**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"到达车流波动性大、计数间隔短导致方差大时适用\n\n**核心公式**\n\n$$P(k)=C_{\\beta+k-1}^{k}p^\\beta(1-p)^k,\\qquad p=\\frac{m}{S^2},\\quad \\beta=\\frac{m^2}{S^2-m}$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-108","question":"**爱尔朗分布**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"l=1时退化为负指数，l→∞时趋于均一车头时距；l越大车流越拥挤、非随机性越强\n\n**核心公式**\n\n$$P(h\\geq t)=\\sum_{i=0}^{l-1}\\frac{(\\lambda t)^i e^{-\\lambda t}}{i!},\\qquad l=\\frac{m^2}{S^2}$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-109","question":"**M/M/N的排队时间**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"平均消耗时间与平均等待时间；M/M/N明显优于N个平行的M/M/1\n\n**核心公式**\n\n$$\\bar d=\\frac{\\bar q}{\\lambda}+\\frac{1}{\\mu}=\\frac{\\bar n}{\\lambda},\\qquad \\bar w=\\frac{\\bar q}{\\lambda}$$","chapter":"第4章","starLevel":"★★★★☆","cardType":"计算","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-110","question":"**用户均衡的等价条件**\n\n> 简答题｜请分点写出踩分关键词。","answer":"被使用路径的阻抗等于最小阻抗，未被使用路径的阻抗大于等于最小阻抗；可转化为互补条件","chapter":"第4章","starLevel":"★★★★☆","cardType":"简答","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M04-111","question":"**Beckmann变换式**\n\n> 简答题｜请分点写出踩分关键词。","answer":"把用户均衡条件转化为非线性数学规划，最优解与用户均衡条件等价且存在唯一","chapter":"第4章","starLevel":"★★★★☆","cardType":"简答","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-112","question":"**交通量与交通流率的区别**\n\n> 简答题｜请分点写出踩分关键词。","answer":"交通量是一段时间间隔内通过一点的实际车辆数；交通流率是不足1h观测间隔换算的小时当量车辆数","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-113","question":"**理想条件**\n\n> 简答题｜请分点写出踩分关键词。","answer":"道路条件（车道数、宽度、平纵线形、视距）、交通条件（组成、流量及车道方向分布）、控制条件（信号影响最大）、环境条件（横向干扰与秩序）","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-114","question":"**服务水平分级**\n\n> 简答题｜请分点写出踩分关键词。","answer":"美国《道路通行能力手册》分A~F六级；我国新规范采用六级，一级自由、舒适度高，六级拥堵、运行不稳定","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-115","question":"**基本路段的理想条件**\n\n> 简答题｜请分点写出踩分关键词。","answer":"车道宽3.75~4.50m、侧向净宽≥1.75m、车流全为小客车、驾驶员为经常行驶且技术熟练者","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-116","question":"**基本路段服务水平指标**\n\n> 简答题｜请分点写出踩分关键词。","answer":"以V/C为关键参数；V/C为基准条件下最大服务交通量与基本通行能力之比","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-117","question":"**无信号交叉口穿越间隙**\n\n> 简答题｜请分点写出踩分关键词。","answer":"进口停车等候所需间隙7~9s；驶近减速待机所需间隙6~8s，且与流向有关","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-118","question":"**信号交叉口服务水平**\n\n> 简答题｜请分点写出踩分关键词。","answer":"新建道路交叉口按三级服务水平设计；指标包括控制延误、负荷度、排队长度","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-119","question":"**常规环形交叉口通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"按交织段通行能力计算，重车超15%需修正，设计通行能力取计算值0.85\n\n**核心公式**\n\n$$C=\\frac{280(1+e/w)(1-p/3)}{1+w/l}$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-120","question":"**进站与离站时间**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"按匀变速假定，由最小间隔与加速度（减速度）反算；b取1.5m/s²、a取1.0m/s²\n\n**核心公式**\n\n$$t_1=\\sqrt{\\frac{2l}{b}},\\qquad t_4=\\sqrt{\\frac{2l}{a}}$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-121","question":"**乘客上下车时间**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"与客车容量、上下车比例、单人用时、车门数有关；K取0.25~0.35、t₀约2s\n\n**核心公式**\n\n$$t_3=\\frac{\\Omega Kt_0}{n_d}$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-122","question":"**提高公交线路通行能力的措施**\n\n> 简答题｜请分点写出踩分关键词。","answer":"站点管理（维持秩序缩短上下车时间）、车辆设计（增车门、加宽门、低底盘）、动力与驾驶、线路设置（分设停靠站）","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-123","question":"**自行车道理论通行能力（按行驶原理）**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"由动的安全净空反算；l₀=0.5时最大车速17.43km/h、通行能力2119辆/h\n\n**核心公式**\n\n$$L=\\frac{Vt}{3.6}+\\beta V^2+l_{\\text{车}}+l_0,\\qquad N=\\frac{1000V}{L}$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-124","question":"**自行车道理论通行能力（按车头时距）**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"t_i为连续车流中两车纵向最小时间间隔；实测平均1.8s，得1500~3000辆/h，平均2000辆/h\n\n**核心公式**\n\n$$N_{\\text{时}}=\\frac{3600}{t_i}$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-125","question":"**自行车道实际通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"短时间最大通过量与实际可能通行能力均按有效宽度（B−0.5）折算；无分隔1800、有分隔2100辆/(h·m)\n\n**核心公式**\n\n$$N_{\\text{可}}=\\frac{N_t}{B-0.5}\\times3600$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-126","question":"**自行车道设计通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"长路段乘街道等级系数C₁（快速干道、主干道0.8；次干道、支路0.9）；短路段再乘综合折减系数C₂（约0.55）\n\n**核心公式**\n\n$$N_{\\text{长}}=N_{\\text{可}}C_1,\\qquad N_{\\text{设}}=C_1C_2N_{\\text{可}}$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-127","question":"**行人步行速度**\n\n> 简答题｜请分点写出踩分关键词。","answer":"人行道0.55~1.7m/s、计算用1.0m/s；过街0.9~1.4m/s、计算用1.2m/s；天桥与地道一般0.52~0.80m/s","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-128","question":"**人行横道基本通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"平均5300人/(t_gh·m)，范围4800~5700\n\n**核心公式**\n\n$$C_{bc}=\\frac{3600v_{pc}}{s_pb_p t_{gh}}$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-129","question":"**人行天桥与地道通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"平均3120人/(h·m)，范围2000~3800\n\n**核心公式**\n\n$$C_{bg}=\\frac{3600v_{bg}}{s_pb_p}$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-130","question":"**行人服务水平**\n\n> 简答题｜请分点写出踩分关键词。","answer":"以人均占用道路面积、步行速度、自由程度、超越横穿可能性与安全舒适度评价；影响因素含舒适、便利、安全、可靠、经济","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-131","question":"**通行能力分析的时间间隔**\n\n> 简答题｜请分点写出踩分关键词。","answer":"通常采用高峰时间流率；以15min作为研究流量与运行质量相互关系的时间间隔","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-132","question":"**影响通行能力的主要因素**\n\n> 简答题｜请分点写出踩分关键词。","answer":"道路几何条件、交通组成、驾驶员条件、路侧干扰；路面质量与气候影响大但难量化，未列入主要因素","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-133","question":"**通行能力与服务水平的作用**\n\n> 简答题｜请分点写出踩分关键词。","answer":"用于道路规划设计（定技术等级、车道数、爬坡车道）与运行状况分析（评估适应程度、找瓶颈、定改善措施）","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-134","question":"**道路交通设施分类**\n\n> 简答题｜请分点写出踩分关键词。","answer":"按管理分城间公路、城市道路、公交线路、人行道与自行车道；按流运行分连续流设施与间断流设施","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-135","question":"**高等级道路**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"一般指高速公路与城市快速路，具中央分隔带、上下行至少两车道、全部立体交叉、完全控制出入","chapter":"第5章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-136","question":"**高等级道路的组成**\n\n> 简答题｜请分点写出踩分关键词。","answer":"由基本路段、交织区、匝道（含匝道—主线连接处与匝道—横交道路连接处）三部分组成","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-137","question":"**驾驶员条件修正系数**\n\n> 简答题｜请分点写出踩分关键词。","answer":"在0.95~1.00之间取值","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-138","question":"**无信号交叉口行车规定**\n\n> 简答题｜请分点写出踩分关键词。","answer":"主要道路车辆优先通行、可一直通过；次要道路车辆让行，寻找间隙穿越","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-139","question":"**左转车对直行通行能力的折减**\n\n> 简答题｜请分点写出踩分关键词。","answer":"对向到达左转车超过一定数量（交叉口小时为3n、大时为4n，n为每小时信号周期数）需折减本方向直行车道通行能力","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-140","question":"**环形交叉口的类型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"常规（中心岛直径>25m）、小型（<25m）、微型（一般<4m）","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-141","question":"**小型环形交叉口通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"按进口道宽度与中心岛面积估算，设计通行能力取0.8\n\n**核心公式**\n\n$$C=K\\left(\\sum w+\\sqrt{A}\\right)$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-142","question":"**公共交通线路的组成**\n\n> 简答题｜请分点写出踩分关键词。","answer":"由供乘客上下车的停靠车站、道路路段和交叉口组成；目的是运送人而非保证车辆通行","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-143","question":"**公交服务水平**\n\n> 简答题｜请分点写出踩分关键词。","answer":"分六级，按公共汽车平均车头时距（发车频率的倒数）度量；评价指标含可达性、舒适性、便利性","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-144","question":"**公交分设停靠站的通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"n为分设站点数（1~3），K为相互干扰折减系数（n=1时1、n=2时0.8、n=3时0.7）\n\n**核心公式**\n\n$$C_{\\text{线}}'=nCK$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-145","question":"**自行车道服务水平指标**\n\n> 简答题｜请分点写出踩分关键词。","answer":"交通量负荷系数X=N/C、速度比例系数Y=v实/vmax、密度饱和系数q=q实/qmax；X<0.4为一级、0.85为四级","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-146","question":"**行人交通设施**\n\n> 简答题｜请分点写出踩分关键词。","answer":"包括人行道、人行横道、人行天桥、人行地道等；流量与密度增加时行人速度下降、行动自由度降低","chapter":"第5章","starLevel":"★★★★☆","cardType":"简答","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M05-147","question":"**行人可能通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"基本通行能力乘综合折减系数，一般取0.5~0.7\n\n**核心公式**\n\n$$C_p=C_b\\gamma,\\qquad \\gamma=0.5\\sim0.7$$","chapter":"第5章","starLevel":"★★★★☆","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-148","question":"**城市道路交通规划**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"以城市总体规划为基础，以满足土地利用产生的交通需求为目的，对道路网、交通设施与交通组织作出的系统安排","chapter":"第6章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-149","question":"**规划的期限分类**\n\n> 简答题｜请分点写出踩分关键词。","answer":"远期20~50年、中期5~20年、近期3~5年；特大与大城市三类都要做，中小城市一般只做后两类","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-150","question":"**城市道路交通规划的主要内容**\n\n> 简答题｜请分点写出踩分关键词。","answer":"总体设计、现状调查分析、需求预测、路网方案设计、方案评价、方案调整优化、实施计划","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-151","question":"**规划工作流程**\n\n> 简答题｜请分点写出踩分关键词。","answer":"现状调研→交通调查→现状分析→需求分析（生成、分布、方式划分、分配）→方案制定→方案评价","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-152","question":"**居民出行OD调查**\n\n> 简答题｜请分点写出踩分关键词。","answer":"调查职业年龄与起讫点等；方法有家庭访问法、电话询问法；抽样率取城市人口1%~5%","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-153","question":"**生存出行与弹性出行**\n\n> 简答题｜请分点写出踩分关键词。","answer":"上班、上学、回程等生存出行占80%~90%；弹性（生活）出行占10%~20%，占比越高生活水平越高","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-154","question":"**出行产生预测模型**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"以回归模型为主，线性模型通常已有足够精度\n\n**核心公式**\n\n$$Y_{ij}=a+bX_{ij}$$","chapter":"第6章","starLevel":"★★★★☆","cardType":"计算","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-155","question":"**平均增长系数法**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"按起讫点增长系数的平均值增长，需迭代使修正系数趋近1\n\n**核心公式**\n\n$$F=\\frac{F_{O,i}+F_{D,j}}{2},\\qquad T_{ij}^{\\prime}=T_{ij}F$$","chapter":"第6章","starLevel":"★★★★☆","cardType":"计算","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-156","question":"**Fratar模型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"考虑交通区之间的吸引强度，收敛速度较快","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-157","question":"**Furness模型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"先使起点区出行量平衡，再使终点区平衡，通过迭代使发生与吸引增长系数满足收敛标准","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-158","question":"**路网规划原则**\n\n> 简答题｜请分点写出踩分关键词。","answer":"满足交通运输要求（功能分清、系统分明）、适应城市发展、结合自然条件、考虑市政管线","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-159","question":"**道路功能分类**\n\n> 简答题｜请分点写出踩分关键词。","answer":"快速路、主干路、次干路、支路四类；快速路与主干路为交通性，次干路兼有交通性与生活性，支路为生活性","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-160","question":"**方格网式路网**\n\n> 简答题｜请分点写出踩分关键词。","answer":"优点整齐简洁、利于建筑布置与方向识别、组织简便；缺点通达性差、非直线系数大、对角线不便、过境交通不易分流","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-161","question":"**放射环形式路网**\n\n> 简答题｜请分点写出踩分关键词。","answer":"优点了利于市中心与分区联系、通达性好、非直线系数小、利于扩展与过境分流；缺点组织不灵活、放射线过多致中心集中","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-162","question":"**快速路规划要点**\n\n> 简答题｜请分点写出踩分关键词。","answer":"为高速长距离交通设置，起骨干作用；环形放射布局、设中央分隔带、控制出入口、与其他道路立体交叉、支路不得直接相接","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-163","question":"**路段路阻函数**\n\n> 简答题｜请分点写出踩分关键词。","answer":"一般用组合模型预测；U_max为自由车流速度、U_min为维持正常行驶的最低速度，常取设计速度的100%与5%","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-164","question":"**平衡与非平衡模型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"按Wardrop第一、二原理划分；满足第一原理为用户优化平衡、满足第二原理为系统优化平衡；不用该原理而用模拟方法的是非平衡模型","chapter":"第6章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M06-165","question":"**规划对服务水平的要求**\n\n> 简答题｜请分点写出踩分关键词。","answer":"以V/C为划 isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M08-219","question":"**无控制交叉口的通行规则**\n\n> 简答题｜请分点写出踩分关键词。","answer":"有标志标线控制的让优先方先行；无控制的进入路口前停车瞭望、让右方来车先行；转弯车让直行车；相对方向右转车让左转车","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M08-220","question":"**单向交通的种类**\n\n> 简答题｜请分点写出踩分关键词。","answer":"固定式（全部时间单向，如匝道）、定时式（高峰单向、非高峰双向，方向分布系数>2/3）、可逆性（不同时段方向相反，>3/4时可实行）、车种性（仅对某类车限行）","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M08-221","question":"**变向交通管理**\n\n> 简答题｜请分点写出踩分关键词。","answer":"变向车道指不同时间变换某些车道的行车方向或车种，适用于潮汐交通；分方向性变向（缓和方向分布不均）与车种性变向（如高峰变换车道供自行车或机动车）","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M08-222","question":"**HOV车道**\n\n> 简答题｜请分点写出踩分关键词。","answer":"为多乘员车辆（公交、乘坐2人或3人以上的客车、紧急事故车辆）提供的专用车道；减少机动车总出行量、减轻拥堵、服务可靠，多用于高峰阻塞严重路段","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M08-223","question":"**公交专用车道**\n\n> 简答题｜请分点写出踩分关键词。","answer":"适用公共汽车、电车、轻型有轨、地铁与城市铁路列车；形式有路侧专用道、逆向公交专用道、公交专用街；提高运行效率与服务质量，减少城市道路交通量","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeS ":"**无控制交叉口的适应交通量**\n\n> 简答题｜请分点写出踩分关键词。","answer":"次路流量>150辆/h时临界流量400~500辆/h；次路流量<150辆/h时临界流量700辆/h；一般适应交通量不超过800辆/h","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M08-234","question":"**停车让行与减速让行**\n\n> 简答题｜请分点写出踩分关键词。","answer":"单向停车让行：次路车在停止线外停车瞭望；多向停车让行：各方向均需停车后通过；减速让行：次路车不必停车，减速瞭望寻找安全空隙通过","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M08-235","question":"**交叉口控制方式的选择**\n\n> 简答题｜请分点写出踩分关键词。","answer":"按道路等级：主次干路相交用多向停车、单向停车或让路；次干路与支路用单向停车或让路；支路与支路用单向停车、让路或不加管制；另按流量、事故、行人稠密程度与趋势选择","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M08-236","question":"**禁行交通管理**\n\n> 简答题｜请分点写出踩分关键词。","answer":"按道路与交通条件对机动车和非机动车实行限制性管理；分时段禁行、错日禁行、车种禁行、转弯禁行、重量高度速度禁行","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M08-237","question":"**TRANSYT**\n\n> 简答题｜请分点写出踩分关键词。","answer":"定时脱机式区域控制系统，由仿真模型与优化两部分组成，通过迭代优选出性能指标最佳的系统配时","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M08-238","question":"**交通管理规划的范围**\n\n> 简答题｜请分点写出踩分关键词。","answer":"交通管理战略规划（10~20年、大城市）、城市交通综合管理规划（中长期3~10年、近期1~3年）、专项管理规划（1~10年、固定地点周边）","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M08-239","question":"**交通管理规划方案设计的内容**\n\n> 简答题｜请分点写出踩分关键词。","answer":"TDM方案（车辆发展规模、交通结构优化、运行组织规划）、TSM方案（横断面、交叉口、标志标线、信号优化、停车、指挥系统、ITS规划）、秩序保障体系","chapter":"第8章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-240","question":"**交通事故分类标准**\n\n> 简答题｜请分点写出踩分关键词。","answer":"按形态分侧面相撞等11种；按原因分机动车、驾驶人、行人等六大类；按严重程度分轻微、一般、重大、特大","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-241","question":"**回归到均值及偏差**\n\n> 简答题｜请分点写出踩分关键词。","answer":"高事故频次后可能回落、低后可能反弹；不考虑回归到均值会引入选择偏差，导致对改善措施有效性高估或低估","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-242","question":"**安全的定义（基于事故数据）**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"实体在一段时间内可能发生的事故数及不同种类和严重程度的事故结果，由事故频次、严重性和类型衡量","chapter":"第9章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-243","question":"**事故的绝对指标**\n\n> 简答题｜请分点写出踩分关键词。","answer":"用事故次数、死亡人数、受伤人数衡量不同地区或路段的事故情况；死亡时间需标准化并附加修正因子","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-244","question":"**事故严重性等级**\n\n> 简答题｜请分点写出踩分关键词。","answer":"按最严重伤害分K（致命）、A（致残）、B（不致残的明显伤害）、C（可能伤害）、O（无伤害或仅财产损失）五级","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-245","question":"**直接评价法**\n\n> 简答题｜请分点写出踩分关键词。","answer":"以事故频次期望值作为设施安全性评价指标，依赖完善事故统计；含事前事后分析法与横断面分析法","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-246","question":"**事前事后分析法**\n\n> 简答题｜请分点写出踩分关键词。","answer":"对比改善措施前后的属性与事故数据分析安全效益；朴素法假设前后道路安全性不变但现实中难成立，需用考虑因素修正的方法","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-247","question":"**路网交通安全勘察**\n\n> 简答题｜请分点写出踩分关键词。","answer":"确立目标、识别参考群体（交叉点、道路段）、选择性能评价指标（如平均事故频次）、选择鉴别方法（滑动窗口法、简单排序法、峰值搜索法）、鉴别与评价","chapter":"第9章","starLevel":"★★★☆☆","cardType":" 次不能可靠反映长期安全性，须用长期数据度量","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-253","question":"**事故数据分析的数据需求**\n\n> 简答题｜请分点写出踩分关键词。","answer":"事故数据（位置、时间、严重性、类型及道路车辆人员信息）、设施数据（路段分类车道数、交叉口）、交通量数据（常用AADT）","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-254","question":"**事故估计与事故预测**\n\n> 简答题｜请分点写出踩分关键词。","answer":"事故估计指预测或估计特定时间、不同条件下路段事故频次的方法；预测用于给定线形与交通量条件下地点设施的事故频次","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-255","question":"**事故经济损失费用**\n\n> 简答题｜请分点写出踩分关键词。","answer":"实际分析以财产损失为参考，将死亡、受伤人员损失折算为经济损失费用，以便统一比较不同类型事故","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-256","question":"**横断面分析法**\n\n> 简答题｜请分点写出踩分关键词。","answer":"事前事后数据难获取时采用，比较两类相似设施（一类已改善）的事故数据；不体现变化过程，仅作同期对比","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-257","question":"**交通事故频次预测模型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"最初基于泊松回归，后发展出负二项、零膨胀泊松等；建模需注意数据过度分散、欠分散与时变特性","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-258","question":"**交通事故严重性模型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"严重程度数据具离散特征；从二项离散模型发展到多项离散、Nested 与随机参数 Logit，及有序 probit、Logit 模型","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-259","question":"**交通安全管理的一般流程**\n\n> 简答题｜请分点写出踩分关键词。","answer":"找出可实施事故频次或严重程度措施的地点→了解事故模式与对策→估计经济效益→优化项目列表→评估对策有效性；各环节迭代循环","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M09-260","question":"**交通安全改善方案与效益评估**\n\n> 简答题｜请分点写出踩分关键词。","answer":"据事故影响因素选措施，可用哈顿矩阵定位致因；效益评估比较措施实施成本与事故频次或严重程度变化转化的货币值","chapter":"第9章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M10-261","question":"**环境**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"影响人类生存和发展的各种天然或人工改造的自然因素总体；以人类为主体的外部世界，分自然环境与社会环境","chapter":"第10章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M10-262","question":"**道路交通大气污染物及影响因素**\n\n> 简答题｜请分点写出踩分关键词。","answer":"污染物为总悬浮微粒、氮氧化物、一氧化碳、二氧化硫及光化学氧化剂；影响因素有运行状态、速度、燃料种类、发动机类型、驾驶技术、道路纵坡、城市规模与交通量","chapter":"第10章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M10-263","question":"**大气污染控制方法**\n\n> 简答题｜请分点写出踩分关键词。","answer":"制定严格排放标准与法规、建立空气质量监测系统、控制排污量并发展无公害汽车、加强道路养护环保对策、加强交通管理使汽车匀速行驶","chapter":"第10章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M10-264","question":"**声压与声压级**\n\n> 简答题｜请分点写出踩分关键词。","answer":"声压是声波通过媒质时产生的压力强度；交通工程中衡量声压大小的标准有SPL、dB(A)及Lx等","chapter":"第10章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M10-265","question":"**交通噪声的传播与衰减**\n\n> 简答题｜请分点写出踩分关键词。","answer":"声强随距离按平方反比规律衰减；传播中还有大气吸收、树林散射吸收等附加衰减；遇障碍物产生衍射绕射","chapter":"第10章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M10-266","question":"**交通噪声的治理措施**\n\n> 简答题｜请分点写出踩分关键词。","answer":"制订法令条例、合理规划城市（控制人口、划分功能区、合理利用土地）、建设声屏障减弱传播（利用地形建筑物、重视路网规划、绿化带降噪）","chapter":"第10章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M10-267","question":"**道路交通光污染**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"自然光反射或不合理人工光照影响自然环境、危害健康、干扰正常活动的现象；具局部性、不残留性和相对性","chapter":"第10章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M10-268","question":"**光污染的产生与危害**\n\n> 简答题｜请分点写出踩分关键词。","answer":"源于对向车辆眩光与道路照明设施（约35%~50%由此产生）；危害人体（短暂失明、视疲劳、白内障）、影响交通（判断失误）与生态（破坏生物节律）","chapter":"第10章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M10-269","question":"**道路交通振动污染**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"由车辆行驶引起的地面与建筑物振动；与桥梁基础结构、道路两侧岩土层能量传播特性有关，频率相近时引起共振","chapter":"第10章","starLevel":"★★★★☆","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M10-270","question":"**振动量测与评价**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"用VAL表示振动大小，单位为dB；以铅垂方向振动加速度衡量环境影响，实测振级与区域标准比较判断超标\n\n**核心公式**\n\n$$L=20\\lg\\left(\\frac{a}{a_0}\\right),\\qquad a_0=10^{-6}\\ \\text{m/s}^2$$","chapter":"第10章","starLevel":"★★★★☆","cardType":"计算","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M10-271","question":"**交通环境保护的目的**\n\n> 简答题｜请分点写出踩分关键词。","answer":"自然环境保护人类生存发展资源条件；研究交通对环境影响及控制措施 Time":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-291","question":"**交通仿真的发展历程**\n\n> 简答题｜请分点写出踩分关键词。","answer":"60年代起步（TRANSYT，宏观模型）；70—80年代迅速发展（NETSIM，微观模型）；90年代至今深化完善，呈高精度、多样化、在线仿真特点","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-292","question":"**交通仿真的发展趋势**\n\n> 简答题｜请分点写出踩分关键词。","answer":"提高模型精度与描述能力、突破微观与宏观界限实现一体化、发展硬件在环与软件在环仿真、在线仿真成为热点、开发适合中国国情的自主系统","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-293","question":"**道路设施模型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"描述道路几何特征与车道划分，是仿真中重要的静态模型和载体；Vissim中用Link代表路段、Connector描述交叉口连接","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-294","question":"**交通生成模型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"解决交通流输入问题；用离散型分布（泊松、二项）描述到达数量波动，用连续型分布（负指数、移位负指数）研究车头时距","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-295","question":"**OD需求与路径选择**\n\n> 简答题｜请分点写出踩分关键词。","answer":"用分时段OD矩阵描述需求，区域元素对应OD点编号；路径选择分固定（加载时确定、行驶中不变）与可变（按频率更新路段费用表）","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-296","question":"**车辆跟驰模型（仿真中）**\n\n> 简答题｜请分点写出踩分关键词。","answer":"微观仿真中重要的动态模型，从人车单元运动与相互作用层次分析单车道交通流；求解可得速度、加速度、位置等微观参数及宏观参数","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-297","question":"**换道判断的四个阶段**\n\n> 简答题｜请分点写出踩分关键词。","answer":"是否需要换道→在目标车道行驶是否改善行车状况→选择何车道（右侧行驶规则下左换概率是右换的4倍）→是否可能进入目标车道","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-298","question":"**超车模型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"前车速度小于40km/h且速度差大于5km/h可考虑超车；前车速度大于40km/h时速度差须大于15km/h；须满足超车视距","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-299","question":"**交通网络流模型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"非拥挤网络对应最大流与最小费用问题（消圈算法）；拥挤网络对应平衡交通分配问题，基本模型用Frank-Wolfe算法求解","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-300","question":"**仿真模型的选择原则**\n\n> 简答题｜请分点写出踩分关键词。","answer":"选能最大限度满足问题需求的模型，综合考虑技术、费用时间、效益、编程技巧、技术支持与风险；明确目的、简化规模、注意可扩展性","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-301","question":"**仿真系统的数据结构**\n\n> 简答题｜请分点写出踩分关键词。","answer":"车辆类（Vehicle）存储影响运行的因素；路段类（Road）以“链”表示两个行车方向；路口类（Cross）含位置、是否灯控及冲突点","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-302","question":"**仿真系统功能模块**\n\n> 简答题｜请分点写出踩分关键词。","answer":"路网模块（节点与路段、节段、车道）、仿真模块（随机数产生、车辆初始化、属性设置、车辆处理、网内点处理、检测器模块）","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-303","question":"**TransCAD 与 TransModeler**\n\n> 简答题｜请分点写出踩分关键词。","answer":"均为美国Caliper公司产品；TransCAD是基于GIS的宏观交通仿真软件，TransModeler可模拟多种路网并微观展示交通流","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-304","question":"**CUBE/TRIPS**\n\n> 简答题｜请分点写出踩分关键词。","answer":"TRIPS为英国MVA公司基于四阶段模型的规划软件包；CUBE为其改进版，开放式结构、运算快精度高，核心是CUBEBase并与ArcGIS衔接","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-305","question":"**Paramics 与 TSIS**\n\n> 简答题｜请分点写出踩分关键词。","answer":"Paramics为英国Quadstone公司的微观仿真软件包，由建模器、处理器、分析器、编程器、监视器和估计器组成；TSIS为美国联邦公路局开发的微观仿真软件","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M11-306","question":"**交通仿真软件的选择依据**\n\n> 简答题｜请分点写出踩分关键词。","answer":"技术性能（问题规模、运动逻辑、混合交通考虑、灵敏度、成功案例）、输入输出接口、二次开发接口、用户培训与技术支持及升级","chapter":"第11章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M12-307","question":"**ITS的特点与技术体系**\n\n> 简答题｜请分点写出踩分关键词。","answer":"交叉学科，具系统化、信息化、动态化特点；技术体系含传感技术、人机工程学、人工智能、通信技术、计算机技术","chapter":"第12章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M12-308","question":"**ITS的建设目标**\n\n> 简答题｜请分点写出踩分关键词。","answer":"实现人、车、路、环境协同与管理智能化，包含提高运输效率、优化出行服务等方面共六个目标","chapter":"第12章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M12-309","question":"**ITS的产生背景**\n\n> 简答题｜请分点写出踩分关键词。","answer":"汽车化带来事故频发、能耗过量、环境污染，增加道路供给不可持续；先实施TSM与TDM、发展轨道交通与公交优先，后整合多种技术建立ITS","chapter":"第12章","starLevel":"★★★☆☆","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuo   function defaultReview() {

  /* ============================================================
     Markdown + KaTeX 渲染
     ============================================================ */
  function protectMath(text) {
    const store = [];
    let s = String(text || '');
    s = s.replace(/\$\$([\s\S]+?)\$\$/g, (m, tex) => {
      store.push({ tex: tex.trim(), display: true });
      return `@@MATH${store.length - 1}@@`;
    });
    s = s.replace(/\\\[([\s\S]+?)\\\]/g, (m, tex) => {
      store.push({ tex: tex.trim(), display: true });
      return `@@MATH${store.length - 1}@@`;
    });
    s = s.replace(/\\\(([\s\S]+?)\\\)/g, (m, tex) => {
      store.push({ tex: tex.trim(), display: false });
      return `@@MATH${store.length - 1}@@`;
    });
    s = s.replace(/(^|[^\\$])\$([^$\n]+?)\$/g, (m, pre, tex) => {
      store.push({ tex: tex.trim(), display: false });
      return `${pre}@@MATH${store.length - 1}@@`;
    });
    return { text: s, store };
  }
  function renderKatex(tex, display) {
    if (window.katex && typeof window.katex.renderToString === 'function') {
      try {
        return window.katex.renderToString(tex, {
          displayMode: !!display,
          throwOnError: false,
          strict: 'ignore',
          trust: false,
          output: 'html'
        });
      } catch (e) {
        return `<code class="math-fallback">${esc(tex)}</code>`;
      }
    }
    return `<code class="math-fallback" title="KaTeX 未加载，显示公式源码">${esc(tex)}</code>`;
  }
  function sanitizeHtml(html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = html;
    const drop = tpl.content.querySelectorAll('script, iframe, object, embed, style, link, meta, img, video, audio, source, form, input, button');
    drop.forEach(el => el.remove());
    tpl.content.querySelectorAll('*').forEach(el => {
      Array.from(el.attributes).forEach(attr => {
        const name = attr.name.toLowerCase();
        const val = String(attr.value || '');
        if (name.startsWith('on') || name === 'style' || name === 'srcdoc' || name === 'formaction') {
          el.removeAttribute(attr.name);
        } else if ((name === 'href' || name === 'src' || name === 'xlink:href') && /^\s*(javascript|data|vbscript):/i.test(val)) {
          el.removeAttribute(attr.name);
        }
      });
      if (el.tagName === 'A') {
        el.setAttribute('rel', 'noopener noreferrer');
        el.setAttribute('target', '_blank');
      }
    });
    return tpl.innerHTML;
  }
  function inlineFallback(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function fallbackMarkdown(s) {
    // CDN 中的 marked 不可用时的极简 Markdown 兜底，保证离线也能读题背题
    const lines = String(s || '').replace(/\r\n/g, '\n').split('\n');
    const out = [];
    let para = [], ul = [], ol = [], quote = [];
    const flushPara = () => { if (para.length) { out.push(`<p>${para.join('<br>')}</p>`); para = []; } };
    const flushUl = () => { if (ul.length) { out.push(`<ul>${ul.join('')}</ul>`); ul = []; } };
    const flushOl = () => { if (ol.length) { out.push(`<ol>${ol.join('')}</ol>`); ol = []; } };
    const flushQuote = () => { if (quote.length) { out.push(`<blockquote><p>${quote.join('<br>')}</p></blockquote>`); quote = []; } };
    const flushAll = () => { flushPara(); flushUl(); flushOl(); flushQuote(); };
    lines.forEach(line => {
      const t = line.trim();
      if (!t) { flushAll(); return; }
      let m;
      if ((m = t.match(/^###\s+(.+)$/))) { flushAll(); out.push(`<h3>${inlineFallback(m[1])}</h3>`); return; }
      if ((m = t.match(/^##\s+(.+)$/))) { flushAll(); out.push(`<h2>${inlineFallback(m[1])}</h2>`); return; }
      if ((m = t.match(/^#\s+(.+)$/))) { flushAll(); out.push(`<h1>${inlineFallback(m[1])}</h1>`); return; }
      if (/^---+$/.test(t)) { flushAll(); out.push('<hr>'); return; }
      if ((m = t.match(/^>\s?(.*)$/))) {
        flushPara(); flushUl(); flushOl();
        quote.push(inlineFallback(m[1]));
        return;
      }
      if ((m = t.match(/^[-*]\s+(.+)$/))) {
        flushPara(); flushQuote(); flushOl();
        ul.push(`<li>${inlineFallback(m[1])}</li>`);
        return;
      }
      if ((m = t.match(/^\d+\.\s+(.+)$/))) {
        flushPara(); flushQuote(); flushUl();
        ol.push(`<li>${inlineFallback(m[1])}</li>`);
        return;
      }
      flushUl(); flushOl(); flushQuote();
      para.push(inlineFallback(t));
    });
    flushAll();
    return out.join('');
  }
  function renderRich(text) {
    if (!text) return '';
    const { text: masked, store } = protectMath(text);
    let html;
    if (window.marked && typeof window.marked.parse === 'function') {
      try {
        html = window.marked.parse(masked, { gfm: true, breaks: true });
      } catch (e) {
        html = fallbackMarkdown(masked);
      }
    } else {
      html = fallbackMarkdown(masked);
    }
    html = sanitizeHtml(html);
    html = html.replace(/@@MATH(\d+)@@/g, (m, i) => {
      const item = store[Number(i)];
      if (!item) return '';
      const rendered = renderKatex(item.tex, item.display);
      return item.display ? `<div class="math-scroll">${rendered}</div>` : rendered;
    });
    return html;
  }
