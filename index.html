  /* ============================================================
     学习计划 / 队列
     ============================================================ */
  function getPlanCounts(day) {
    const now = Date.now();
    const allActive = activeCards();
    const due = allActive.filter(c => c.reviewInfo.lastReviewTime > 0 && Number(c.reviewInfo.nextReviewTimeStamp) <= now);
    const dayCards = allActive.filter(c => c.planDay === day);
    const newLeft = dayCards.filter(c => isNewCard(c)).length;
    const todayDone = dayCards.filter(c => sameLocalDay(c.reviewInfo.lastReviewTime)).length;
    const weak = allActive.filter(c => c.isWeakCard).length;
    const fiveUnlearned = dayCards.filter(c => c.starLevel === STARS[0] && isNewCard(c)).length;
    return {
      due: due.length,
      newLeft,
      todayDone,
      weak,
      planTotal: dayCards.length,
      planLearned: dayCards.filter(c => !isNewCard(c)).length,
      fiveUnlearned,
      archived: state.cards.filter(c => c.isArchived).length,
      total: state.cards.length
    };
  }
  function sortByPriority(list) {
    return list.slice().sort((a, b) => {
      const sd = starNum(b.starLevel) - starNum(a.starLevel);
      if (sd) return sd;
      const ad = isDue(a), bd = isDue(b);
      if (ad !== bd) return ad ? -1 : 1;
      if (ad && bd) return Number(a.reviewInfo.nextReviewTimeStamp) - Number(b.reviewInfo.nextReviewTimeStamp);
      const pa = a.planDay ? parseInt(a.planDay.slice(1), 10) : 99;
      const pb = b.planDay ? parseInt(b.planDay.slice(1), 10) : 99;
      if (pa !== pb) return pa - pb;
      return String(a.id).localeCompare(String(b.id));
    });
  }
  function buildPlanQueue(day) {
    if (typeof day === 'number') day = `D${clamp(day, 1, 10)}`;
    if (typeof day === 'string' && /^\d+$/.test(day)) day = `D${clamp(parseInt(day, 10), 1, 10)}`;
    const due = activeCards().filter(c => c.reviewInfo.lastReviewTime > 0 && Number(c.reviewInfo.nextReviewTimeStamp) <= Date.now());
    const dayNew = activeCards().filter(c => c.planDay === day && isNewCard(c));
    return sortByPriority([...due, ...dayNew]);
  }
  function initPlanQueue(force = false) {
    if (force || !ui.plan.initialized) {
      const day = `D${clamp(Number(state.settings.currentDay) || 1, 1, 10)}`;
      ui.plan.queue = buildPlanQueue(day).map(c => c.id);
      ui.plan.idx = 0;
      ui.plan.revealed = false;
      ui.plan.done = false;
      ui.plan.skipped = 0;
      ui.plan.initialized = true;
    }
  }
  function buildTestQueue() {
    const f = state.settings.testFilters;
    let list = activeCards();
    if (f.chapter !== 'all') list = list.filter(c => c.chapter === f.chapter);
    if (f.onlyFive) list = list.filter(c => c.starLevel === STARS[0]);
    else if (f.star !== 'all') list = list.filter(c => c.starLevel === f.star);
    if (f.type !== 'all') list = list.filter(c => c.cardType === f.type);
    return sortByPriority(list);
  }
  function initTestQueue(force = false) {
    if (force || !ui.test.initialized) {
      ui.test.queue = buildTestQueue().map(c => c.id);
      ui.test.idx = 0;
      ui.test.revealed = false;

    }
  }
  function filterFreeCards() {
    const f = state.settings.freeFilters;
    let list = activeCards();
    if (Array.isArray(f.chapters) && f.chapters.length) list = list.filter(c => f.chapters.includes(c.chapter));
    if (Array.isArray(f.stars) && f.stars.length) list = list.filter(c => f.stars.includes(c.starLevel));
    if (Array.isArray(f.types) && f.types.length) list = list.filter(c => f.types.includes(c.cardType));
    if (f.weakOnly) list = list.filter(c => c.isWeakCard);
    return list;
  }
  function buildFreeQueue() {
    const list = filterFreeCards();
    if (state.settings.freeFilters.shuffle) {
      return list.slice().sort(() => Math.random() - 0.5);
    }
    return sortByPriority(list);
  }
  function initFreeQueue(force = false) {
    if (force || !ui.free.initialized) {
      ui.free.queue = buildFreeQueue().map(c => c.id);

  /* ============================================================
     改良 FSRS 间隔重复
     ============================================================ */
  function scheduleCard(card, rating) {
    const ri = card.reviewInfo;
    const now = Date.now();
    const wasNew = !ri.lastReviewTime;
    const oldStability = Number(ri.stability) || 0;
    let stability = oldStability;
    let difficulty = Number(ri.difficulty) || 5;
    let continuous = Number(ri.continuousCorrect) || 0;
    let intervalMs = 0;

    if (rating === 0) {
      // 完全不会：重置连续掌握计数，10 分钟后重来，自动进薄弱本
      stability = 10 / 1440;
      difficulty = Math.min(10, difficulty + 1.25);
      continuous = 0;
      intervalMs = 10 * 60 * 1000;
      card.isWeakCard = true;
    } else if (rating === 1) {
      // 有点印象：间隔小幅增加，连续计数不变
      stability = Math.max(0.5, oldStability ? oldStability * 1.25 : 0.5);
      difficulty = Math.min(10, difficulty + 0.3);
      intervalMs = Math.max(12 * 3600 * 1000, stability * 86400000);
    } else if (rating === 2) {
      // 基本掌握：中等拉长，连续 +1
      stability = Math.max(1.3, oldStability ? oldStability * 1.9 + 0.2 : 1.3);
      difficulty = Math.max(1, difficulty - 0.15);
      continuous += 1;
      intervalMs = Math.max(24 * 3600 * 1000, stability * 86400000);
    } else {
      // 熟练默写：大幅拉长，连续 +1
      stability = Math.max(2.4, oldStability ? oldStability * 2.8 + 0.5 : 2.4);
      difficulty = Math.max(1, difficulty - 0.35);
      continuous += 1;
      intervalMs = Math.max(2 * 86400000, stability * 86400000);
    }

    if (rating > 0) {
      // 五星更早回到复习队列；二星稍微放缓，避免低优先级挤占五星
      const factor = { '★★★★★': 0.90, '★★★★☆': 0.97, '★★★☆☆': 1.03, '★★☆☆☆': 1.12 }[card.starLevel] || 1;
      stability *= factor;
      intervalMs = Math.round(stability * 86400000);
      intervalMs = clamp(intervalMs, rating === 1 ? 6 * 3600 * 1000 : rating === 2 ? 24 * 3600 * 1000 : 2 * 86400000, 180 * 86400000);
    }

    ri.nextReviewTimeStamp = now + Math.round(intervalMs);
    ri.continuousCorrect = continuous;
    ri.lastSelfRate = rating;
    ri.lastReviewTime = now;
    ri.stability = Number(stability.toFixed(4));
    ri.difficulty = Number(difficulty.toFixed(3));
    ri.reps = Math.max(0, Number(ri.reps) || 0) + 1;
    return { wasNew, intervalMs };
  }
  function recordReview(card, rating, wasNew) {
    const key = todayKey();
    const d = state.stats.daily[key] || { reviewed: 0, newLearned: 0, weakAdded: 0, seconds: 0, ratings: [0, 0, 0, 0] };
    d.reviewed = (Number(d.reviewed) || 0) + 1;
    if (wasNew) d.newLearned = (Number(d.newLearned) || 0) + 1;
    if (rating === 0) d.weakAdded = (Number(d.weakAdded) || 0) + 1;
    if (!Array.isArray(d.ratings)) d.ratings = [0, 0, 0, 0];
    d.ratings[rating] = (Number(d.ratings[rating]) || 0) + 1;
    d.seconds = Number(d.seconds) || 0;
    state.stats.daily[key] = d;
  }
  function todayStat(key) {
    const d = state.stats.daily[todayKey()] || {};
    return Number(d[key]) || 0;
  }

  function ratingBlock() {

  /* ============================================================
     题库管理
     ============================================================ */
  function manageFilteredCards() {
    const f = state.settings.manageFilters;
    let list = state.cards.slice();
    if (f.q) {
      const q = f.q.toLowerCase();
      list = list.filter(c => [c.question, c.answer, c.note, c.chapter, c.cardType, c.starLevel, c.planDay || ''].join(' ').toLowerCase().includes(q));
    }
    if (f.chapter !== 'all') list = list.filter(c => c.chapter === f.chapter);
    if (f.star !== 'all') list = list.filter(c => c.starLevel === f.star);
    if (f.type !== 'all') list = list.filter(c => c.cardType === f.type);
    if (f.status === 'active') list = list.filter(c => !c.isArchived);
    else if (f.status === 'weak') list = list.filter(c => c.isWeakCard);
    else if (f.status === 'archived') list = list.filter(c => c.isArchived);
    return list.sort((a, b) => {
      const ca = chapterNum(a.chapter), cb = chapterNum(b.chapter);
      if (ca !== cb) return ca - cb;
      const sa = starNum(a.starLevel), sb = starNum(b.starLevel);
      if (sa !== sb) return sb - sa;
      return String(a.id).localeCompare(String(b.id));
    });
  }
  function manageRow(card) {

  /* ============================================================

  function chapterStats() {
    return CHAPTERS.map((ch, idx) => {
      const list = state.cards.filter(c => c.chapter === ch);
      let mastered = 0, weak = 0;
      list.forEach(c => {
        if (c.isArchived) mastered++;
        else if (c.isWeakCard) weak++;
        else if (c.reviewInfo.continuousCorrect >= 2 || c.reviewInfo.lastSelfRate === 3) mastered++;
      });
      const rest = Math.max(0, list.length - mastered - weak);
      return { ch, n: idx + 1, total: list.length, mastered, weak, rest };
    });
  }
  function starCounts() {
    return STARS.map(s => state.cards.filter(c => c.starLevel === s).length);
  }
  function last7Days() {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const key = dayKeyOffset(-i);
      const d = new Date();
      d.setDate(d.getDate() - i);
      out.push({ key, label: `${d.getMonth() + 1}/${d.getDate()}`, count: Number((state.stats.daily[key] || {}).reviewed) || 0 });
    }
    return out;
  }
  function calendarHTML() {
    const [y, m] = ui.stats.month.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    const daysInMonth = new Date(y, m, 0).getDate();
    const offset = (first.getDay() + 6) % 7;
    const today = todayKey();
    let cells = '';
    for (let i = 0; i < offset; i++) cells += '<div></div>';
    let monthTotal = 0, checkDays = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${y}-${pad2(m)}-${pad2(d)}`;
      const count = Number((state.stats.daily[key] || {}).reviewed) || 0;
      if (count > 0) { monthTotal += count; checkDays++; }
      const level = count === 0 ? 0 : count < 15 ? 1 : count < 40 ? 2 : 3;
      cells += `<div class="cal-day ${key === today ? 'today' : ''}" data-level="${level}" title="${key}：复习 ${count} 张"><span>${d}</span><span class="cal-count">${count ? count : ''}</span></div>`;
    }
    return `<div class="panel panel-pad">
      <div class="calendar-head">
        <button class="btn btn-soft btn-icon btn-sm" type="button" data-action="calendar-prev" aria-label="上个月"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>

      </div>

        ${['一', '二', '三', '四', '五', '六', '日'].map(w => `<div class="calendar-weekday">${w}</div>`).join('')}

    </div>`;
  }

  function destroyCharts() {
    Object.keys(ui.charts).forEach(k => {
      try { ui.charts[k].destroy(); } catch (e) { /* noop */ }
      delete ui.charts[k];
    });
  }
  function initCharts() {
    if (!window.Chart) {
      renderChartFallback();
      return;
    }
    const dark = document.documentElement.dataset.theme === 'dark';
    const text = dark ? '#d4d0c5' : '#41474a';
    const grid = dark ? 'rgba(255,255,255,.08)' : 'rgba(40,35,25,.08)';
    const starCanvas = $('#starChart');
    const actCanvas = $('#activityChart');
    if (starCanvas) {
      const stars = starCounts();
      ui.charts.star = new Chart(starCanvas, {
        type: 'doughnut',
        data: {
          labels: ['★★★★★', '★★★★☆', '★★★☆☆', '★★☆☆☆'],
          datasets: [{ data: stars, backgroundColor: ['#b58a32', '#c0a166', '#718a91', '#c9c1ae'], borderColor: dark ? '#1d2321' : '#fffdf8', borderWidth: 3, hoverOffset: 4 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
          plugins: { legend: { position: 'bottom', labels: { color: text, boxWidth: 12, padding: 14, font: { size: 11 } } }, tooltip: { callbacks: { label: ctx => ` ${ctx.label}：${ctx.raw} 张` } } }
        }
      });
    }
    if (actCanvas) {
      const days = last7Days();
      ui.charts.activity = new Chart(actCanvas, {
        type: 'bar',
        data: {
          labels: days.map(d => d.label),
          datasets: [{ label: '复习张数', data: days.map(d => d.count), backgroundColor: dark ? '#8f625b' : '#a9524b', borderRadius: 5, maxBarThickness: 34 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
          scales: {
            x: { grid: { display: false }, ticks: { color: text, font: { size: 11 } } },
            y: { beginAtZero: true, suggestedMax: 10, grid: { color: grid }, ticks: { color: text, precision: 0, font: { size: 11 } } }
          },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.raw} 张` } } }
        }
      });
    }
  }
  function renderChartFallback() {

  function rateCurrent(rating) {
    const mode = ui.mode;
    const s = ui[mode];
    if (!s.revealed) { toast('请先显示参考答案，再自评。', 'warn'); return; }
    const card = currentCard(mode);
    if (!card) return;
    autoStartStudy();
    const result = scheduleCard(card, rating);
    recordReview(card, rating, result.wasNew);
    persist();
    const label = ['完全不会', '有点印象', '基本掌握', '熟练默写'][rating];
    let msg = `已记录：${label}，${formatInterval(result.intervalMs)}。`;
    if (rating === 0) msg += ' 已自动加入薄弱本。';
    toast(msg, rating === 0 ? 'warn' : 'success');
    advance(mode);
  }
  function skipCurrent() {
    const mode = ui.mode;
    const s = ui[mode];
    const card = currentCard(mode);
    if (!card) return;
    s.skipped += 1;
    s.idx += 1;
    s.revealed = false;
    if (s.idx >= s.queue.length) s.done = true;
    persist();
    renderMode(mode);
    toast('已跳过，不计入复习。', '');
  }

      renderWeak();

      renderManage();

  function autoStartStudy() {
    if (!timer.study.running && timer.study.elapsed === 0) {
      timer.study.running = true;
      updateTimerUI();
    }
  }
  function startStudy() {
    if (!timer.study.running) {
      timer.study.running = true;
      updateTimerUI();
    }
  }
  function pauseStudy() {
    timer.study.running = false;
    accountStudyPartial();
    updateTimerUI();
  }
  function resetStudy() {
    accountStudyPartial();
    timer.study.running = false;
    timer.study.elapsed = 0;
    timer.study.accounted = 0;
    updateTimerUI();
  }
  function accountStudyPartial() {
    const extra = Math.max(0, timer.study.elapsed - timer.study.accounted);
    if (extra > 0) {
      const d = state.stats.daily[todayKey()] || { reviewed: 0, newLearned: 0, weakAdded: 0, seconds: 0, ratings: [0, 0, 0, 0] };
      d.seconds = (Number(d.seconds) || 0) + extra;
      state.stats.daily[todayKey()] = d;
      timer.study.accounted = timer.study.elapsed;
      saveSoon();
    }
  }
  function pomoReset() {
    timer.pomo.running = false;
    timer.pomo.remaining = timer.pomo.mode === 'work' ? 25 * 60 : 5 * 60;
    updateTimerUI();
  }
  function pomoStart() {
    if (!timer.pomo.enabled) return;
    if (timer.pomo.remaining <= 0) pomoReset();
    timer.pomo.running = true;
    updateTimerUI();
  }
  function pomoPause() {
    timer.pomo.running = false;
    updateTimerUI();
  }
  function tick() {
    if (timer.study.running) {
      timer.study.elapsed += 1;
      if (timer.study.elapsed - timer.study.accounted >= 60) {
        const add = timer.study.elapsed - timer.study.accounted;
        const d = state.stats.daily[todayKey()] || { reviewed: 0, newLearned: 0, weakAdded: 0, seconds: 0, ratings: [0, 0, 0, 0] };
        d.seconds = (Number(d.seconds) || 0) + add;
        state.stats.daily[todayKey()] = d;
        timer.study.accounted = timer.study.elapsed;
        saveSoon();
      }
    }
    if (timer.pomo.running) {
      timer.pomo.remaining -= 1;
      if (timer.pomo.remaining <= 0) {
        timer.pomo.running = false;
        if (timer.pomo.mode === 'work') {
          timer.pomo.mode = 'break';
          timer.pomo.remaining = 5 * 60;
          timer.pomo.running = true;
          toast('25 分钟学习完成，已切换到 5 分钟休息。', 'success');
          beep();
        } else {
          timer.pomo.mode = 'work';
          timer.pomo.remaining = 25 * 60;
          toast('5 分钟休息结束，准备开始下一轮。', 'warn');
          beep();
        }
      }
    }
    updateTimerUI();
  }
  function beep() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 660;
      gain.gain.value = 0.06;
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      setTimeout(() => { osc.stop(); ctx.close(); }, 220);
    } catch (e) { /* noop */ }
  }
  function updateTimerUI() {

  }

  function downloadFile(name, text, type) {
    const blob = new Blob([text], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1200);
  }
  function importJSONFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result || ''));
        const cards = Array.isArray(parsed) ? parsed : parsed.cards;
        if (!Array.isArray(cards) || !cards.length) throw new Error('文件中没有 cards 数组');
        ui.pendingImport = parsed;
        openModal('确认恢复 JSON 备份', `<p>即将用备份覆盖当前全部数据。</p><div class="danger-confirm">备份包含 ${cards.length} 张卡片；当前有 ${state.cards.length} 张。恢复后当前题库、进度、笔记、统计都会被替换。</div><p class="modal-note" style="margin-top:10px;">建议先把当前数据导出备份，再执行恢复。</p><div class="modal-actions"><button class="btn btn-soft" type="button" data-action="close-modal">取消</button><button class="btn btn-danger" type="button" data-action="restore-json">覆盖并恢复</button></div>`);
      } catch (e) {
        toast(`JSON 解析失败：${e.message}`, 'error');
      }
    };
    reader.readAsText(file, 'utf-8');
  }
  function restoreJSON() {
    const parsed = ui.pendingImport;
    ui.pendingImport = null;
    if (!parsed) return;
    const cards = Array.isArray(parsed) ? parsed : parsed.cards;
    if (!Array.isArray(cards) || !cards.length) { toast('备份中没有有效卡片。', 'error'); return; }
    state.cards = normalizeCards(cards);
    if (parsed && !Array.isArray(parsed)) {
      state.settings = normalizeSettings(parsed.settings);
      state.stats = normalizeStats(parsed.stats);
    }
    applyTheme(state.settings.theme);
    applyFontScale(state.settings.fontScale);
    timer.pomo.enabled = !!state.settings.pomodoroEnabled;
    resetAllSessions();
    persist();
    closeModal();
    updateTimerUI();
    setMode('plan', false);
    toast(`已恢复 ${state.cards.length} 张卡片与全部进度。`, 'success');
  }
  function parseBulkText(text) {
    const blocks = String(text || '').split(/\n\s*---+\s*\n/).map(s => s.trim()).filter(Boolean);
    const parsed = [];
    const errors = [];
    blocks.forEach((block, bi) => {
      let work = block;
      const meta = {};
      work = work.replace(/【\s*(章节|星级|题型|计划)\s*[:：]\s*([^】]+)】/g, (m, k, v) => {
        meta[k] = v.trim();
        return '';
      });
      // 兼容紧凑写法：【计划D2】【第3章】【星级★★★★★】【题型简答】
      work = work.replace(/【\s*计划\s*(D\d+)\s*】/gi, (m, v) => { meta['计划'] = v; return ''; });
      work = work.replace(/【\s*第\s*(\d{1,2})\s*章\s*】/g, (m, v) => { meta['章节'] = `第${v}章`; return ''; });
      work = work.replace(/【\s*星级\s*([★☆]{5})\s*】/g, (m, v) => { meta['星级'] = v; return ''; });
      work = work.replace(/【\s*题型\s*(名词解释|简答|计算)\s*】/g, (m, v) => { meta['题型'] = v; return ''; });
      const lines = work.split(/\n/).map(s => s.trim());
      const qLines = [], aLines = [];
      let section = null;
      lines.forEach(line => {
        if (!line) return;
        let m = line.match(/^【\s*(题目|答案|章节|星级|题型|计划)\s*】\s*[:：]?\s*(.*)$/);
        if (m) {
          const k = m[1], v = (m[2] || '').trim();
          if (k === '题目') { section = 'q'; if (v) qLines.push(v); }
          else if (k === '答案') { section = 'a'; if (v) aLines.push(v); }
          else { meta[k] = v; }
          return;
        }
        m = line.match(/^(题目|问题|答案|Q|A)\s*[:：]\s*(.*)$/i);
        if (m) {
          const k = m[1], v = (m[2] || '').trim();
          if (/^(题目|问题|Q)$/i.test(k)) { section = 'q'; if (v) qLines.push(v); }
          else { section = 'a'; if (v) aLines.push(v); }
          return;
        }
        if (section === 'a') aLines.push(line);
        else if (section === 'q') qLines.push(line);
        else qLines.push(line);
      });
      const chapter = normalizeChapter(meta['章节'] || '第1章');
      const starLevel = normalizeStar(meta['星级'] || '');
      const cardType = normalizeType(meta['题型'] || '简答');
      const planDay = normalizePlanDay(meta['计划'] || '');
      const question = qLines.join('\n').trim();
      const answer = aLines.join('\n').trim();
      if (!question || !answer) {
        errors.push(`第 ${bi + 1} 段：缺少题目或答案，已跳过。`);
        return;
      }
      parsed.push(normalizeCard({
        id: uid('T817-IMP'),
        question,
        answer,
        chapter,
        starLevel,
        cardType,
        planDay,
        reviewInfo: defaultReview(),
        isWeakCard: false,
        isArchived: false,
        note: ''
      }));
    });
    return { parsed, errors };
  }
  function confirmBulk() {
    if (!ui.manage.bulkParsed.length) return;
    const count = ui.manage.bulkParsed.length;
    state.cards.push(...ui.manage.bulkParsed);
    ui.manage.bulkParsed = [];
    ui.manage.bulkErrors = [];
    ui.manage.bulkRaw = '';
    ui.manage.bulkOpen = false;
    resetAllSessions();
    persist();
    renderManage();
    toast(`已导入 ${count} 张卡片。`, 'success');
  }
  function buildTextExport() {
    const list = manageFilteredCards();
    const f = state.settings.manageFilters;
    const head = [
      '817 交通工程学 · 背诵清单',
      `导出时间：${new Date().toLocaleString('zh-CN', { hour12: false })}`,
      `筛选：章节=${f.chapter}｜星级=${f.star}｜题型=${f.type}｜关键词=${f.q || '无'}`,
      `共 ${list.length} 张`,
      '='.repeat(46),
      ''
    ];
    const body = list.map(c => {
      const note = c.note ? `\n笔记：${c.note}` : '';
      return `【${c.starLevel}】【${c.chapter}】【${c.cardType}】${c.planDay ? `【${c.planDay}】` : ''}\n题目：${stripMarkdown(c.question)}\n答案：${stripMarkdown(c.answer)}${note}\n${'-'.repeat(40)}`;
    }).join('\n\n');
    return head.join('\n') + body;
  }
  function openTextExport() {
    const text = buildTextExport();
    openModal('导出纯文本清单', `<p class="modal-note">可直接复制到 Word / 备忘录打印；公式以 LaTeX 源码保留，便于核对。文本对应当前题库筛选结果（默认不含归档）。</p><textarea class="text-output" id="textOutput" readonly>${esc(text)}</textarea><div class="modal-actions"><button class="btn btn-soft" type="button" data-action="download-text">下载 .txt</button><button class="btn btn-primary" type="button" data-action="copy-text">复制文本</button></div>`, { wide: true });
  }
  function copyText() {
    const ta = $('#textOutput');
    if (!ta) return;
    const text = ta.value;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast('已复制到剪贴板。', 'success')).catch(() => fallbackCopy(ta));
    } else fallbackCopy(ta);
  }
  function fallbackCopy(ta) {
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
      toast('已复制到剪贴板。', 'success');
    } catch (e) {
      toast('复制失败，请手动全选复制。', 'error');
    }
  }
  function downloadText() {
    const ta = $('#textOutput');
    if (!ta) return;
    downloadFile(`817背诵清单_${todayKey()}.txt`, ta.value, 'text/plain;charset=utf-8');
    toast('已下载纯文本清单。', 'success');
  }

  /* ============================================================
     高危操作
     ============================================================ */
  function resetProgressData() {
    state.cards.forEach(c => {
      c.reviewInfo = defaultReview();
      c.isWeakCard = false;
      c.isArchived = false;
    });
    state.stats.daily = {};
    resetAllSessions();
    persist();
    renderMode(ui.mode);
    toast('已重置全部学习进度，题库与笔记保留。', 'warn');
  }
  function clearBankData() {
    state.cards = [];
    state.stats.daily = {};
    resetAllSessions();
    persist();
    setMode('manage', false);
    renderManage();
    toast('题库已清空。可通过 JSON 导入恢复。', 'error');
  }
  function restoreBuiltinData() {
    state.cards = normalizeCards(clone(BUILTIN));
    state.stats.daily = {};
    resetAllSessions();
    persist();
    setMode('plan', false);
    toast('已恢复内置 471 张题库，学习进度已清零。', 'success');
  }
  function doResetProgress() { resetProgressData(); }
  function doClearBank() { clearBankData(); }
  function doRestoreBuiltin() { restoreBuiltinData(); }
  function doResetDay(day) {
    const d = day || `D${state.settings.currentDay}`;
    state.cards.filter(c => c.planDay === d).forEach(c => {
      c.reviewInfo = defaultReview();
      c.isWeakCard = false;
      c.isArchived = false;
    });
    initPlanQueue(true);
    persist();
    renderPlan();
    toast(`${d} 学习进度已重置，笔记保留。`, 'warn');
  }
  function openWeakAt(id) {
    initWeakQueue(true);
    const idx = ui.weak.queue.indexOf(id);
    if (idx >= 0) {
      ui.weak.idx = idx;
      ui.weak.revealed = false;
      setMode('weak', false);
      renderWeak();
    } else {
      toast('该卡片当前不在薄弱卡组中。', 'warn');
    }
  }

  /* ============================================================
     事件处理
     ============================================================ */
  function onFreeFilter(kind, value) {
    const f = state.settings.freeFilters;
    if (!Array.isArray(f[kind])) f[kind] = [];
    const idx = f[kind].indexOf(value);
    if (idx >= 0) f[kind].splice(idx, 1);
    else f[kind].push(value);
    ui.free.dirty = true;
    saveSoon();
    renderFree();
  }
  function handleAction(action, el, event) {
    if (!action) return;
    switch (action) {
      case 'close-modal': closeModal(); break;
      case 'open-help': openHelp(); break;
      case 'open-timer': openTimerModal(); break;
      case 'toggle-theme': toggleTheme(); break;
      case 'select-day': {
        const day = clamp(parseInt(el.dataset.day, 10) || 1, 1, 10);
        state.settings.currentDay = day;
        persist();
        ui.plan.initialized = false;
        initPlanQueue(true);
        renderPlan();
        break;
      }
      case 'reset-day': dangerConfirm('重置本天学习进度', `将重置 D${state.settings.currentDay} 所有卡片的复习状态、薄弱标记与归档状态；题库与笔记保留。`, '重置本天', 'reset-day', `D${state.settings.currentDay}`); break;
      case 'reveal': {
        const s = ui[ui.mode];
        if (!s) break;
        autoStartStudy();
        s.revealed = true;
        renderMode(ui.mode);
        break;
      }
      case 'skip': skipCurrent(); break;
      case 'rate': rateCurrent(parseInt(el.dataset.rating, 10) || 0); break;
      case 'toggle-weak': toggleWeak(el.dataset.id); break;
      case 'unweak': unweakCurrent(el.dataset.id); break;
      case 'type-tip': {
        const c = currentCard('test');
        if (c) showTypeTip(c.cardType);
        break;
      }
      case 'test-apply': {
        state.settings.testFilters = {
          chapter: $('#testChapter').value,
          star: $('#testStar').value,
          type: $('#testType').value,
          onlyFive: $('#testOnlyFive').checked
        };
        persist();
        initTestQueue(true);
        renderTest();
        break;
      }
      case 'test-reset': {
        state.settings.testFilters = clone(DEFAULT_SETTINGS.testFilters);
        persist();
        initTestQueue(true);
        renderTest();
        break;
      }
      case 'test-rebuild': rebuildTest(); break;
      case 'free-rebuild': initFreeQueue(true); renderFree(); break;
      case 'free-reset': {
        state.settings.freeFilters = clone(DEFAULT_SETTINGS.freeFilters);
        ui.free.dirty = true;
        persist();
        initFreeQueue(true);
        renderFree();
        break;
      }
      case 'free-shuffle': {
        state.settings.freeFilters.shuffle = true;
        ui.free.queue = buildFreeQueue().map(c => c.id);
        ui.free.idx = 0;
        ui.free.revealed = false;
        ui.free.done = false;
        ui.free.initialized = true;
        ui.free.dirty = false;
        persist();
        renderFree();
        toast('已洗牌。', 'success');
        break;
      }
      case 'rebuild-plan': rebuildPlan(); break;
      case 'rebuild-weak': rebuildWeak(); break;
      case 'go-plan': setMode('plan'); break;
      case 'go-stats': setMode('stats'); break;
      case 'go-weak': setMode('weak'); break;
      case 'go-manage': setMode('manage'); break;
      case 'weak-open': openWeakAt(el.dataset.id); break;
      case 'page-prev': ui.manage.page = Math.max(1, ui.manage.page - 1); renderManage(); break;
      case 'page-next': ui.manage.page += 1; renderManage(); break;
      case 'add-card': cardEditModal(null); break;
      case 'edit-card': {
        const c = getCard(el.dataset.id);
        if (c) cardEditModal(c);
        break;
      }
      case 'save-card': saveCard(); break;
      case 'delete-card': deleteCard(el.dataset.id); break;
      case 'delete-confirm': doDelete(); break;
      case 'archive-card': archiveCard(el.dataset.id); break;
      case 'export-json': exportJSON(); break;
      case 'import-json': { const input = $('#jsonFileInput'); if (input) { input.value = ''; input.click(); } break; }
      case 'restore-json': restoreJSON(); break;
      case 'parse-bulk': {
        const text = $('#bulkText') ? $('#bulkText').value : '';
        const r = parseBulkText(text);
        ui.manage.bulkRaw = text;
        ui.manage.bulkParsed = r.parsed;
        ui.manage.bulkErrors = r.errors;
        ui.manage.bulkOpen = true;
        renderManage();
        if (!r.parsed.length) toast('没有解析到可导入的卡片，请检查格式。', 'error');
        else toast(`解析成功 ${r.parsed.length} 张，请确认预览。`, 'success');
        break;
      }
      case 'confirm-bulk': confirmBulk(); break;
      case 'clear-bulk': ui.manage.bulkRaw = ''; ui.manage.bulkParsed = []; ui.manage.bulkErrors = []; ui.manage.bulkOpen = true; persist(); renderManage(); break;
      case 'export-text': openTextExport(); break;
      case 'copy-text': copyText(); break;
      case 'download-text': downloadText(); break;
      case 'reset-progress': dangerConfirm('重置全部学习进度', '将清空所有卡片的自评、复习间隔、连续掌握、薄弱与归档状态，并清空打卡统计；题库和笔记保留。', '重置全部进度', 'reset-progress'); break;
      case 'clear-bank': dangerConfirm('一键清空全部题库', `将删除全部 ${state.cards.length} 张卡片、笔记与学习进度。此操作不可撤销。`, '清空全部题库', 'clear-bank'); break;
      case 'restore-builtin': dangerConfirm('恢复内置题库', '将用内置 471 张题库覆盖当前全部卡片，并清空所有复习进度与笔记。', '恢复内置题库', 'restore-builtin'); break;
      case 'danger-next': dangerNext(); break;
      case 'danger-final': dangerFinal(); break;
      case 'calendar-prev': {
        let [y, m] = ui.stats.month.split('-').map(Number);
        m -= 1; if (m < 1) { m = 12; y -= 1; }
        ui.stats.month = `${y}-${pad2(m)}`; renderStats(); break;
      }
      case 'calendar-next': {
        let [y, m] = ui.stats.month.split('-').map(Number);
        m += 1; if (m > 12) { m = 1; y += 1; }
        ui.stats.month = `${y}-${pad2(m)}`; renderStats(); break;
      }
      case 'study-start': startStudy(); break;
      case 'study-pause': pauseStudy(); break;
      case 'study-reset': resetStudy(); break;
      case 'pomo-start': pomoStart(); break;
      case 'pomo-pause': pomoPause(); break;
      case 'pomo-reset': pomoReset(); break;
      default: break;
    }
  }
  function bindEvents() {
    document.addEventListener('click', event => {
      const nav = event.target.closest('[data-mode]');
      if (nav && nav.classList.contains('nav-btn')) {
        event.preventDefault();
        setMode(nav.dataset.mode);
        return;
      }
      const freeChip = event.target.closest('[data-free-filter]');
      if (freeChip) {
        event.preventDefault();
        onFreeFilter(freeChip.dataset.freeFilter, freeChip.dataset.value);
        return;
      }
      const actionEl = event.target.closest('[data-action]');
      if (actionEl) {
        if (actionEl.tagName === 'INPUT' && actionEl.type === 'checkbox') return;
        event.preventDefault();
        handleAction(actionEl.dataset.action, actionEl, event);
        return;
      }
      const cardEl = event.target.closest('.flashcard[data-card-tap]');
      if (cardEl) {
        if (event.target.closest('button, a, input, textarea, select, label')) return;
        if (ui.mode === 'test') return;
        const s = ui[ui.mode];
        if (s && !s.revealed) {
          autoStartStudy();
          s.revealed = true;
          renderMode(ui.mode);
        }
      }
    });

    document.addEventListener('change', event => {
      const t = event.target;
      if (t.id === 'manageChapter' || t.id === 'manageStar' || t.id === 'manageType' || t.id === 'manageStatus') {
        state.settings.manageFilters = {
          q: state.settings.manageFilters.q,
          chapter: $('#manageChapter') ? $('#manageChapter').value : state.settings.manageFilters.chapter,
          star: $('#manageStar') ? $('#manageStar').value : state.settings.manageFilters.star,
          type: $('#manageType') ? $('#manageType').value : state.settings.manageFilters.type,
          status: $('#manageStatus') ? $('#manageStatus').value : state.settings.manageFilters.status
        };
        ui.manage.page = 1;
        persist();
        renderManage();
      } else if (t.id === 'freeWeakOnly') {
        state.settings.freeFilters.weakOnly = !!t.checked;
        ui.free.dirty = true;
        saveSoon();
        renderFree();
      } else if (t.id === 'freeShuffle') {
        state.settings.freeFilters.shuffle = !!t.checked;
        ui.free.dirty = true;
        saveSoon();
        renderFree();
      } else if (t.id === 'pomoEnabled') {
        timer.pomo.enabled = !!t.checked;
        state.settings.pomodoroEnabled = timer.pomo.enabled;
        if (!timer.pomo.enabled) { timer.pomo.running = false; timer.pomo.remaining = 25 * 60; timer.pomo.mode = 'work'; }
        persist();
        updateTimerUI();
        toast(timer.pomo.enabled ? '番茄钟已开启。' : '番茄钟已关闭。', '');
      } else if (t.id === 'jsonFileInput') {
        const file = t.files && t.files[0];
        importJSONFile(file);
        t.value = '';
      }
    });

    document.addEventListener('input', event => {
      const t = event.target;
      if (t.id === 'manageSearch') {
        state.settings.manageFilters.q = t.value;
        ui.manage.page = 1;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          ui.manage.searchFocus = true;
          saveSoon();
          renderManage();
        }, 220);
      } else if (t.id === 'noteInput') {
        const card = getCard(t.dataset.cardId);
        if (card) {
          card.note = t.value;
          const stateEl = $('#noteState');
          if (stateEl) stateEl.textContent = '已保存';
          saveSoon();
        }
      } else if (t.id === 'bulkText') {
        ui.manage.bulkRaw = t.value;
      } else if (t.id === 'fontScale') {
        const val = clamp(parseInt(t.value, 10) || 100, 100, 150);
        state.settings.fontScale = val;
        applyFontScale(val);
        saveSoon();
      }
    });

    document.addEventListener('toggle', event => {
      if (event.target && event.target.id === 'bulkDetails') {
        ui.manage.bulkOpen = !!event.target.open;
      }
    }, true);

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        const root = $('#modalRoot');
        if (root && !root.hidden) { closeModal(); return; }
      }
      const tag = (event.target && event.target.tagName || '').toLowerCase();
      if (['input', 'textarea', 'select', 'button'].includes(tag)) return;
      const root = $('#modalRoot');
      if (root && !root.hidden) return;
      if (ui.mode === 'test') return;
      const s = ui[ui.mode];
      if (!s || !currentCard(ui.mode)) return;
      if (event.code === 'Space' && !s.revealed) {
        event.preventDefault();
        autoStartStudy();
        s.revealed = true;
        renderMode(ui.mode);
      } else if (s.revealed && ['1', '2', '3', '4'].includes(event.key)) {
        event.preventDefault();
        rateCurrent(parseInt(event.key, 10) - 1);
      }
    });

    window.addEventListener('beforeunload', () => {
      accountStudyPartial();
      persist();
    });
  }

  /* ============================================================
     初始化
     ============================================================ */
  let libUpgradeTimer = null;
  window.__T817_LIB_UPGRADE__ = function () {
    // CDN 是异步加载：加载完成后用真正的 Markdown/KaTeX/Chart.js 重绘一次当前页面
    clearTimeout(libUpgradeTimer);
    libUpgradeTimer = setTimeout(() => {
      if (!window.__T817_READY__) return;
      if (ui.mode === 'stats') renderStats();
      else renderMode(ui.mode);
    }, 120);
  };
  function init() {
    loadData();
    applyTheme(state.settings.theme);
    applyFontScale(state.settings.fontScale);
    timer.pomo.enabled = !!state.settings.pomodoroEnabled;
    timer.pomo.remaining = 25 * 60;
    bindEvents();
    const validModes = ['plan', 'test', 'free', 'weak', 'manage', 'stats'];
    const mode = validModes.includes(state.settings.lastMode) ? state.settings.lastMode : 'plan';
    setMode(mode, false);
    updateTimerUI();
    tickTimer = setInterval(tick, 1000);
    if (!state.cards.length) {
      setTimeout(() => toast('题库为空：可到“题库管理 → 恢复内置题库”或导入 JSON 备份。', 'warn'), 700);
    }
    window.__T817_READY__ = true;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
  </script>
