.answer-rich li { margin: .32em 0; }
.answer-rich li::marker { color: var(--accent); }
.answer-rich strong { color: var(--ink); }
.answer-rich blockquote { margin: .8em 0; padding: 9px 12px; border-left: 3px solid var(--amber); background: var(--amber-soft); color: var(--ink-2); font-size: .92em; }
.answer-rich blockquote p { margin: 0; }
.answer-rich code { font-size: .92em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px; }
.answer-rich pre { overflow-x: auto; padding: 12px; border-radius: 10px; background: var(--surface-2); }
.answer-hidden {
  min-height: 150px; margin-top: 20px; border: 1px dashed var(--line-strong); border-radius: 13px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
  padding: 22px; text-align: center; background: color-mix(in srgb, var(--surface-2) 46%, transparent);
}
.answer-hidden .lock-icon { color: var(--faint); font-size: 20px; }
.answer-hidden p { margin: 0; font-size: 12px; color: var(--muted); max-width: 430px; line-height: 1.6; }
.tap-hint { margin: 12px 2px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--faint); font-size: 11px; }
.kbd { display: inline-flex; align-items: center; min-height: 24px; padding: 1px 7px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); font-size: 10px; color: var(--muted); }
.card-note { margin-top: 14px; }
.card-note label { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
.card-note textarea { width: 100%; min-height: 84px; resize: vertical; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); color: var(--ink); line-height: 1.6; font-size: 14px; }
.note-state { margin-left: auto; color: var(--green); font-size: 10px; font-weight: 400; }
.rating-wrap { margin-top: 16px; }
.rating-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
.rating-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rate-btn {
  min-height: 58px; padding: 8px 10px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px;
}
.rate-btn b { font-size: 13px; white-space: nowrap; }
.rate-btn small { color: var(--muted); font-size: 10px; }
.rate-btn:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.rate-0 { border-left: 4px solid var(--red); }
.rate-1 { border-left: 4px solid var(--amber); }
.rate-2 { border-left: 4px solid var(--green); }
.rate-3 { border-left: 4px solid #285c3f; }
.rate-0:hover { background: var(--red-soft); }
.rate-1:hover { background: var(--amber-soft); }
.rate-2:hover, .rate-3:hover { background: var(--green-soft); }
.finish-box { padding: 38px 22px; text-align: center; }
.finish-box .finish-mark { width: 62px; height: 62px; margin: 0 auto 14px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; font-size: 25px; }
.finish-box h3 { margin: 0 0 5px; font-family: var(--serif); font-size: 24px; }
.finish-box p { margin: 0 auto 16px; max-width: 500px; color: var(--muted); font-size: 13px; }
.skipped-note { color: var(--faint); font-size: 11px; }

/* ---------- filter / forms ---------- */
.filter-panel { padding: 15px 16px; margin-bottom: 16px; }
.filter-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: end; }
.field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 600; }
.field select, .field input[type="text"], .field input[type="search"], .field input[type="number"], .field textarea {
  width: 100%; min-height: 46px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface-2); color: var(--ink); font-size: 14px;
}
.field textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.field select:focus, .field input:focus, .field textarea:focus { border-color: var(--blue); outline: 3px solid color-mix(in srgb, var(--blue) 16%, transparent); }
.switch { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.filter-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.chip-group { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  min-height: 44px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 5px;
}
.chip:hover { border-color: var(--line-strong); color: var(--ink-2); }
.chip.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent-ink); }
.chip.star-chip { letter-spacing: .5px; }
.filter-block { margin-top: 13px; }
.filter-block-title { margin: 0 0 6px; color: var(--muted); font-size: 11px; font-weight: 600; }
.filter-summary { color: var(--faint); font-size: 11px; }

/* ---------- free / weak ---------- */
.free-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 12px; }
.free-count { color: var(--muted); font-size: 12px; white-space: nowrap; padding-top: 4px; }
.weak-hero { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 20px; margin-bottom: 16px; border-left: 3px solid var(--red); }
.weak-hero h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 22px; }
.weak-hero p { margin: 0; color: var(--muted); font-size: 13px; }
.weak-count { font-family: var(--serif); font-size: 38px; color: var(--red); line-height: 1; text-align: center; }
.weak-count small { display: block; color: var(--muted); font-family: var(--sans); font-size: 10px; margin-top: 4px; }

/* ---------- manage ---------- */
.manage-toolbar { padding: 14px 15px; margin-bottom: 16px; }
.manage-toolbar .filter-row { grid-template-columns: minmax(180px, 1.6fr) repeat(4, minmax(0, .8fr)); }
.manage-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
.manage-count { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
.manage-list { display: grid; gap: 9px; }
.manage-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 13px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
}
.manage-row:hover { border-color: var(--line-strong); }
.manage-row.archived { opacity: .66; background: var(--surface-2); }
.manage-main { min-width: 0; }
.manage-topline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 5px; }
.manage-q { margin: 0 0 4px; font-weight: 600; font-size: 14px; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.manage-a { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.manage-meta { margin-top: 5px; color: var(--faint); font-size: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.row-actions { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
.row-actions .btn { min-height: 44px; padding: 7px 9px; font-size: 12px; }
.pager { display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 16px; }
.pager-info { min-width: 100px; text-align: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.details-panel { margin-bottom: 16px; overflow: hidden; }
.details-panel summary { min-height: 52px; padding: 13px 17px; display: flex; align-items: center; gap: 9px; cursor: pointer; font-weight: 600; color: var(--ink-2); list-style: none; }
.details-panel summary::-webkit-details-marker { display: none; }
.details-panel summary::after { content: "＋"; margin-left: auto; color: var(--muted); font-weight: 400; }
.details-panel[open] summary::after { content: "－"; }
.details-body { padding: 0 17px 17px; border-top: 1px solid var(--line); padding-top: 15px; }
.import-help { margin: 0 0 9px; padding: 10px 12px; border-radius: 9px; background: var(--surface-2); color: var(--muted); font-size: 11px; line-height: 1.65; }
.import-help code { color: var(--accent-ink); }
.bulk-preview { margin-top: 12px; }
.preview-list { display: grid; gap: 7px; max-height: 300px; overflow: auto; margin: 8px 0 11px; }
.preview-item { padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
.preview-item .preview-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
.preview-item p { margin: 0; font-size: 12px; color: var(--ink-2); }
.preview-item .preview-a { color: var(--muted); }
.import-errors { color: var(--red); font-size: 12px; margin: 6px 0 0; }
.danger-zone { border-color: color-mix(in srgb, var(--red) 28%, var(--line)); }
.danger-zone .panel-title { color: var(--red); }

/* ---------- stats ---------- */
.stats-summary { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 9px; margin-bottom: 16px; }
.summary-card { padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.summary-label { color: var(--muted); font-size: 11px; }
.summary-value { margin-top: 3px; font-family: var(--serif); font-size: 25px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.summary-value.accent { color: var(--accent); }
.summary-value.gold { color: var(--gold); }
.summary-value.weak { color: var(--red); }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.chart-box { position: relative; height: 285px; padding: 10px 12px 14px; }
.chart-box canvas { max-width: 100%; }
.chart-fallback { display: grid; gap: 10px; padding: 16px; }
.fallback-row { display: grid; grid-template-columns: 58px 1fr 40px; gap: 9px; align-items: center; font-size: 12px; color: var(--muted); }
.fallback-row .bar { height: 10px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.fallback-row .bar i { display: block; height: 100%; background: var(--gold); border-radius: inherit; }
.chapter-progress { display: grid; gap: 10px; padding: 4px 0; }
.chapter-row { display: grid; grid-template-columns: 86px minmax(0, 1fr) 134px; gap: 10px; align-items: center; }
.chapter-name { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.stack-bar { display: flex; height: 9px; border-radius: 99px; overflow: hidden; background: var(--surface-3); }
.stack-bar i { display: block; height: 100%; }
.stack-mastered { background: var(--green); }
.stack-due { background: var(--amber); }
.stack-weak { background: var(--red); }
.chapter-nums { display: flex; justify-content: flex-end; gap: 7px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chapter-legend { display: flex; flex-wrap: wrap; gap: 13px; margin: 2px 0 12px; color: var(--muted); font-size: 11px; }
.legend-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.calendar-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.calendar-title { margin: 0; font-family: var(--serif); font-size: 19px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.calendar-weekday { text-align: center; color: var(--faint); font-size: 10px; padding: 4px 0; }
.cal-day { min-height: 48px; border-radius: 8px; background: var(--surface-2); border: 1px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal-day.out { opacity: .25; }
.cal-day.today { border-color: var(--accent); color: var(--accent-ink); }
.cal-day .cal-count { font-size: 9px; color: var(--faint); }
.cal-day[data-level="1"] { background: color-mix(in srgb, var(--green) 12%, var(--surface-2)); }
.cal-day[data-level="2"] { background: color-mix(in srgb, var(--green) 24%, var(--surface-2)); }
.cal-day[data-level="3"] { background: color-mix(in srgb, var(--green) 40%, var(--surface-2)); color: var(--ink); }
.calendar-legend { display: flex; align-items: center; gap: 8px; margin-top: 11px; color: var(--faint); font-size: 10px; }
.calendar-legend .box { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); }
.calendar-legend .box.l1 { background: color-mix(in srgb, var(--green) 12%, var(--surface-2)); }
.calendar-legend .box.l2 { background: color-mix(in srgb, var(--green) 24%, var(--surface-2)); }
.calendar-legend .box.l3 { background: color-mix(in srgb, var(--green) 40%, var(--surface-2)); }
.weak-list { display: grid; gap: 7px; }
.weak-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); text-align: left; min-height: 48px; }
.weak-item:hover { border-color: var(--line-strong); }
.weak-item .num { color: var(--faint); font-size: 10px; width: 20px; text-align: right; flex: 0 0 20px; }
.weak-item .text { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.weak-item .star { color: var(--gold); font-size: 10px; letter-spacing: .5px; }
.stats-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.tips-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.tips-list li { display: flex; gap: 9px; font-size: 12px; color: var(--muted); line-height: 1.55; }
.tips-num { flex: 0 0 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); font-size: 10px; font-weight: 700; }

/* ---------- modal / toast ---------- */
body.modal-open { overflow: hidden; }
.modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 18px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(20, 18, 14, .52); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.modal-panel {
  position: relative; z-index: 1; width: min(620px, 100%); max-height: min(88vh, 860px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-strong);
  animation: modal-in .14s ease-out;
}
.modal-panel.wide { width: min(900px, 100%); }
@keyframes modal-in { from { opacity: .4; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
.modal-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); }
.modal-title { margin: 0; font-family: var(--serif); font-size: 20px; }
.modal-close { margin-left: auto; width: 44px; height: 44px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; }
.modal-close:hover { background: var(--surface-2); color: var(--ink); }
.modal-body { padding: 18px; }
.modal-body p { color: var(--ink-2); font-size: 14px; }
.modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 17px; }
.modal-note { color: var(--muted); font-size: 12px; line-height: 1.6; }
.modal-form { display: grid; gap: 12px; }
.modal-form .field-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
.modal-list { margin: 8px 0; padding-left: 20px; color: var(--muted); font-size: 12px; line-height: 1.7; }
.modal-list li::marker { color: var(--accent); }
.type-tip { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; background: var(--amber-soft); border-left: 3px solid var(--amber); border-radius: 10px; color: var(--ink-2); font-size: 13px; line-height: 1.65; }
.type-tip i { color: var(--amber); font-size: 18px; margin-top: 2px; }
.type-tip strong { display: block; color: var(--ink); margin-bottom: 2px; }
.timer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.timer-block { border: 1px solid var(--line); border-radius: 13px; padding: 14px; background: var(--surface-2); }
.timer-block h3 { margin: 0 0 2px; font-family: var(--serif); font-size: 17px; }
.timer-block .timer-sub { color: var(--muted); font-size: 11px; }
.timer-display { margin: 13px 0 12px; font-family: var(--serif); font-size: clamp(33px, 7vw, 44px); line-height: 1; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.timer-display.pomo { color: var(--accent); }
.timer-actions { display: flex; gap: 7px; flex-wrap: wrap; }
.timer-actions .btn { flex: 1; min-width: 76px; }
.timer-state { margin: 10px 0 0; color: var(--faint); font-size: 11px; }
.file-note { margin-top: 8px; color: var(--faint); font-size: 11px; line-height: 1.6; }
.text-output { width: 100%; min-height: 420px; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font-family: var(--sans); font-size: 12px; line-height: 1.65; white-space: pre-wrap; }
.danger-confirm { padding: 12px 14px; border-radius: 10px; background: var(--red-soft); color: var(--red); font-weight: 600; font-size: 13px; }

.toast-root { position: fixed; left: 50%; bottom: 22px; z-index: 120; transform: translateX(-50%); display: grid; gap: 7px; width: max-content; max-width: calc(100% - 32px); pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 9px; min-height: 44px; padding: 9px 14px;
  background: color-mix(in srgb, var(--ink) 94%, transparent); color: var(--surface);
  border-radius: 11px; box-shadow: var(--shadow-strong); font-size: 13px; animation: toast-in .16s ease-out;
}
.toast.success { background: color-mix(in srgb, var(--green) 92%, #000); color: #f5fff8; }
.toast.warn { background: color-mix(in srgb, var(--amber) 92%, #000); color: #fffaf0; }
.toast.error { background: color-mix(in srgb, var(--red) 94%, #000); color: #fff8f6; }
.toast i { font-size: 13px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* ---------- math / rich text ---------- */
.rich { overflow-wrap: anywhere; }
.rich .katex-display { margin: .7em 0; padding: .1em 0 .25em; max-width: 100%; overflow-x: auto; overflow-y: hidden; }
.rich .katex { font-size: 1.06em; }
.rich .katex-display > .katex { white-space: normal; }
.math-scroll { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
.markdown-table { width: 100%; border-collapse: collapse; font-size: .92em; }
.markdown-table th, .markdown-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.markdown-table th { background: var(--surface-2); }
.rich a { text-decoration: underline; }

/* ---------- footer ---------- */
.app-footer { padding: 0 0 28px; color: var(--faint); font-size: 11px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; }
.app-footer .footer-left { display: flex; align-items: center; gap: 7px; }
.app-footer button { min-height: 44px; padding: 0 10px; border: 0; background: transparent; color: var(--muted); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; }
.help-block { display: grid; gap: 10px; }
.help-block h3 { margin: 10px 0 0; font-family: var(--serif); font-size: 17px; }
.help-block p, .help-block li { color: var(--ink-2); font-size: 13px; line-height: 1.7; }
.help-block ol { margin: 0; padding-left: 22px; }
.help-block code { background: var(--surface-2); border-radius: 5px; padding: 1px 5px; }
.help-callout { padding: 11px 13px; border-radius: 10px; background: var(--amber-soft); border-left: 3px solid var(--amber); color: var(--ink-2); font-size: 12px; line-height: 1.65; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .plan-grid { grid-template-columns: 1fr; }
  .plan-side { position: static; grid-template-columns: 1fr 1fr; }
  .stats-summary { grid-template-columns: repeat(3, 1fr); }
  .manage-toolbar .filter-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .manage-toolbar .filter-row .field:first-child { grid-column: span 3; }
}
@media (max-width: 900px) {
  .app-shell { width: min(100% - 24px, 1240px); }
  .round-banner { grid-template-columns: repeat(5, minmax(0, 1fr)); overflow: visible; }
  .filter-row { grid-template-columns: 1fr 1fr; }
  .stats-grid, .stats-bottom { grid-template-columns: 1fr; }
  .chapter-row { grid-template-columns: 76px minmax(0, 1fr) 120px; }
  .timer-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .topbar-inner { min-height: 68px; gap: 10px; }
  .brand-mark { width: 42px; height: 42px; flex-basis: 42px; font-size: 13px; }
  .brand-sub { display: none; }
  .brand-title { font-size: 18px; }
  .main-nav { top: 68px; }
  .nav-scroll { padding: 6px 0; }
  .nav-btn { min-width: 86px; min-height: 50px; padding: 5px 9px; font-size: 12px; gap: 6px; }
  .nav-btn i { font-size: 13px; }
  .mode { padding-top: 17px; }
  .mode-head { align-items: flex-start; }
  .head-seal { width: 58px; height: 58px; font-size: 18px; }
  .mode-desc { font-size: 12px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .plan-side { grid-template-columns: 1fr; }
  .round-banner { grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 12px; }
  .flashcard { padding: 17px 15px 16px; min-height: 300px; }

ousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S010","question":"**交通量**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"单位时间段内通过道路某一地点、某一断面或某一条车道的交通实体数，一般指机动车交通量及来往两个方向的车辆数；是随机数，具时空分布特性","chapter":"第2章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S011","question":"**年平均日交通量AADT**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 一年交通量总和除以365，是道路规划的重要控制性指标\n\n**核心公式**\n\n$$AADT=\\frac{\\sum_{i=1}^{365}Q_i}{365}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第2章","starLevel":"★★★★★","cardType":"计算","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S012","question":"**交通量的月变化与月变系数**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 以月份为横坐标、月平均日交通量占年平均日交通量的百分数为纵坐标绘月变图\n- 月变系数为AADT与MADT之比\n\n**核心公式**\n\n$$K_{\\text{月}}=\\frac{AADT}{MADT}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第2章","starLevel":"★★★★★","cardType":"计算","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S013","question":"**高峰小时系数PHF**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 高峰小时交通量与高峰小时内某一时段交通量扩大为高峰小时的交通量之比\n\n**核心公式**\n\n$$PHF=\\frac{V}{4V_{15}}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第2章","starLevel":"★★★★★","cardType":"计算","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S014","question":"**方向分布系数**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 主要行车方向交通量与双向交通量之比\n- 国外上下班路线可达70%，主要干道约60%\n\n**核心公式**\n\n$$K_D=\\frac{Q_{\\text{主要方向}}}{Q_{\\text{双向}}}\\times100\\%$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第2章","starLevel":"★★★★★","cardType":"计算","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S015","question":"**设计小时交通量**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 为保证道路在设计期内满足绝大多数小时车流顺利通过、避免阻塞与投资效率不高而选择的适当小时交通量\n- 美国取第30位最高小时交通量","chapter":"第2章","starLevel":"★★★★★","cardType":"简答","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S016","question":"**第30位小时交通量的K值**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 第30位小时交通量与AADT之比K值稳定\n- 国外K值12%~18%，我国干线公路0.11~0.15、平均0.133","chapter":"第2章","starLevel":"★★★★★","cardType":"简答","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S017","question":"**单向设计小时交通量DDHV**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 用于确定车道数与路幅宽度，考虑方向不均匀系数\n\n**核心公式**\n\n$$DDHV=AADT\\cdot\\frac{K}{100}\\cdot K_D$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第2章","starLevel":"★★★★★","cardType":"计算","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S018","question":"**地点车速**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"车辆通过道路某一地点（断面）时的瞬时车速","chapter":"第2章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D3","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S019","question":"**行驶车速**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"车辆行驶某一区间所需时间（不包括停车时间）与区间距离之比","chapter":"第2章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D3","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S020","question":"**区间车速（行程车速）**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"车辆行驶路程与通过该路程所需总时间（包括停车时间）之比；与行驶车速的差别在于是否计入停车时间","chapter":"第2章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D3","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S021","question":"**临界车速**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"道路通行能力达到最大时的车速","chapter":"第2章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D3","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S022","question":"**设计车速**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"道路交通与气候条件良好时，仅受道路物理条件限制的最大安全车速","chapter":"第2章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D3","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S023","question":"**时间平均车速**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 观测时间内各车辆地点车速的算术平均值\n\n**核心公式**\n\n$$v_t=\\frac{\\sum_{i=1}^{n}v_i}{n}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第2章","starLevel":"★★★★★","cardType":"计算","planDay":"D3","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S024","question":"**区间平均车速**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 总距离除以总时间，等于各车地点车速的调和平均值，恒小于时间平均车速\n\n**核心公式**\n\n$$v_s=\\frac{nL}{\\sum_{i=1}^{n}t_i}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第2章","starLevel":"★★★★★","cardType":"计算","planDay":"D3","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S025","question":"**交通密度**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"某一瞬间单位长度道路上存在的车辆数，单位veh/km","chapter":"第2章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D3","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S026","question":"**临界密度与阻塞密度**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"交通量接近或达到通行能力时的密度为临界密度；车辆无法通行时的密度为阻塞密度","chapter":"第2章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S027","question":"**车头间距与车头时距**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 同向相邻两车车头之间的距离为车头间距，通过同一断面的时间间隔为车头时距\n\n**核心公式**\n\n$$h_s=\\frac{1000}{K},\\qquad h_t=\\frac{3600}{Q}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第2章","starLevel":"★★★★★","cardType":"计算","planDay":"D3","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S028","question":"**浮动车法**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 一辆测试车往返12~16次\n- 记录对向来车数X_a、同向被超越/超越数Y_c、行程时间t_a、t_c\n- 求测定方向交通量、平均行程时间、平均车速\n\n**核心公式**\n\n$$q_c=\\frac{X_a+Y_c}{t_a+t_c},\\qquad \\bar t_c=t_c-\\frac{Y_c}{q_c},\\qquad \\bar v_c=\\frac{l}{\\bar t_c}\\times60$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第3章","starLevel":"★★★★★","cardType":"计算","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S029","question":"**行驶速度**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"车辆行驶在某一区间的运行车速=区间距离/运行时间（不含停车时间）","chapter":"第3章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S030","question":"**区间速度**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"区间距离除以总时间（含停车时间）；与行驶速度区别在于是否计入停车时间","chapter":"第3章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S031","question":"**出入量法**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 选A、B断面，t时刻路段现有车辆数=初始车辆数+驶入累计−驶出累计\n- 密度=现有车辆数/路段长度\n- 超车时E(t0)=q+a−b\n\n**核心公式**\n\n$$E(t)=E(t_0)+Q_A(t)-Q_B(t),\\qquad K(t)=\\frac{E(t)}{L_{AB}},\\qquad E(t_0)=q+a-b$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第3章","starLevel":"★★★★★","cardType":"计算","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S032","question":"**空间占有率**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"观测路段内车辆总长度占路段总长度百分比；反映道路空间被占用程度\n\n**核心公式**\n\n$$R_s=\\frac{\\sum_i L_i}{L}\\times100\\%$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第3章","starLevel":"★★★★★","cardType":"计算","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S033","question":"**时间占有率**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"车辆占用检测器时间总和占总观测时间百分比；可由车长/车速换算\n\n**核心公式**\n\n$$R_t=\\frac{\\sum_i t_i}{T}\\times100\\%$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第3章","starLevel":"★★★★★","cardType":"计算","planDay":"D4","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S034","question":"**延误**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"由于交通摩阻与管理控制引起的行驶时间损失，单位s或min","chapter":"第3章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S035","question":"**固定延误**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"由交通控制装置、标志等引起，与交通流状态和干扰无关，多发生在交叉口","chapter":"第3章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S036","question":"**停车延误**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"车辆停止不动的时间，含停车到起动的驾驶员反应时间","chapter":"第3章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S037","question":"**行驶延误**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"行驶时间与计算时间之差；计算时间按不拥挤车流平均车速通过调查路线计","chapter":"第3章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S038","question":"**排队延误**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"排队时间与以畅行车速驶过排队路段的时间之差；排队时间=第一次停车到越过停车线","chapter":"第3章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S039","question":"**引道延误**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"引道时间与车辆畅行通过引道延误段时间之差；引道时间为受阻排队通过引道延误段的时间","chapter":"第3章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S040","question":"**点样本法**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 每入口3~4人+1块秒表\n- 按15s间隔清点停车线后车数与停驶/不停驶数\n- 间隔不能被周期整除、避开周期起点\n- 优缺点：不依赖信号设备、误差影响小\n- 停车比例高时难适用、单车道无法区分流向","chapter":"第3章","starLevel":"★★★★★","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S041","question":"**饱和流量**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"一次绿灯时间内，进口道或冲突点上连续车队能通过停车线或冲突点的最大流量","chapter":"第3章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S042","question":"**出行**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"人、车、货从出发点到目的地移动的全过程，具有起讫端点、目的、交通方式属性","chapter":"第3章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S043","question":"**出行端点**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"出行起点与讫点的总称；总数是出行次数的两倍","chapter":"第3章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S044","question":"**OD调查方法（传统）**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 观测类：断面交通量、车站上下车人数\n- 询问类：家访、发（放）表、路边询问、明信片、公交站点、购月票、境界线出入、货物流通","chapter":"第3章","starLevel":"★★★★★","cardType":"简答","planDay":"D5","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S045","question":"**连续流基本参数关系**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 交通流率Q、行车速度V_s、车流密度K为基本参数\n- 三参数中两个已知可求第三个\n\n**核心公式**\n\n$$Q=V_sK$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第4章","starLevel":"★★★★★","cardType":"计算","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S046","question":"**连续流特征变量**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 极大流率Q_m、临界速度V_m、最佳密度K_m、阻塞密度K_j、畅行速度V_f\n- 是划分拥挤与否的特征值","chapter":"第4章","starLevel":"★★★★★","cardType":"简答","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S047","question":"**格林希尔茨线性模型**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 速度随密度线性下降\n- K=0时V=V_f，K=K_j时V=0\n\n**核心公式**\n\n$$V=V_f\\left(1-\\frac{K}{K_j}\\right)$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第4章","starLevel":"★★★★★","cardType":"计算","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S048","question":"**流量—密度关系**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 由格林希尔茨模型与基本关系式得二次函数（抛物线）\n- 原点与曲线上点的矢径斜率表示速度\n\n**核心公式**\n\n$$Q=KV_f\\left(1-\\frac{K}{K_j}\\right)$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第4章","starLevel":"★★★★★","cardType":"计算","planDay":"D6","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S049","question":"**饱和车头时距与饱和交通量比率**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 稳定移动车队中不变的车头时距为饱和车头时距h\n- 其倒数为饱和交通量比率\n\n**核心公式**\n\n$$S=\\frac{3600}{h}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第4章","starLevel":"★★★★★","cardType":"计算","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S050","question":"**跟驰理论**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"研究在无法超车的单一车道上车辆列队行驶时，后车跟随前车行驶状态的理论，用数学模型表达跟驰过程中的各种状态","chapter":"第4章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S051","question":"**非自由行驶车队的三个特性**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 制约性（紧随要求、车速条件、间距条件）、延迟性（后车改变滞后于前车）、传递性（状态变化一辆接一辆向后传递且间断连续）","chapter":"第4章","starLevel":"★★★★★","cardType":"简答","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S052","question":"**流体模型的守恒方程**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 基于质量守恒：流入与流出之差等于路段内车辆数变化；Δt\n- 0、Δx\n- 0得连续方程\n\n**核心公式**\n\n$$\\frac{\\partial k}{\\partial t}+\\frac{\\partial q}{\\partial x}=0$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第4章","starLevel":"★★★★★","cardType":"计算","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S053","question":"**激波与激波路径**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 两种密度状态相遇时特征线相交产生激波\n- 波速为流量—密度曲线上两点间弦的斜率\n\n**核心公式**\n\n$$V_w=\\frac{q_2-q_1}{k_2-k_1}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第4章","starLevel":"★★★★★","cardType":"计算","planDay":"D7","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S054","question":"**泊松分布**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 车辆到达服从泊松分布\n- 均值与方差均为m=λt\n- 用S²/m是否显著异于1判别适用性\n\n**核心公式**\n\n$$P(k)=\\frac{(\\lambda t)^k e^{-\\lambda t}}{k!},\\qquad P(k+1)=\\frac{m}{k+1}P(k)$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第4章","starLevel":"★★★★★","cardType":"计算","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S055","question":"**负指数分布**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 车头时距大于等于t的概率\n- λ=Q/3600\n- 均值3600/Q\n- 每车道流量≤500辆/h且可充分超车时适用\n\n**核心公式**\n\n$$P(h\\geq t)=e^{-\\lambda t},\\qquad P(h<t)=1-e^{-\\lambda t}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第4章","starLevel":"★★★★★","cardType":"计算","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S056","question":"**M/M/1基本公式**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 单通道、泊松到达、负指数服务\n- ρ<1时系统稳定\n\n**核心公式**\n\n$$\\rho=\\frac{\\lambda}{\\mu},\\quad P_0=1-\\rho,\\quad P_n=\\rho^n(1-\\rho),\\quad \\bar n=\\frac{\\rho}{1-\\rho}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第4章","starLevel":"★★★★★","cardType":"计算","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S057","question":"**M/M/1排队长度与时间**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 平均排队长度、非零平均排队长度、平均消耗时间、平均等待时间\n\n**核心公式**\n\n$$\\bar q=\\frac{\\rho^2}{1-\\rho},\\quad \\bar q_w=\\frac{1}{1-\\rho},\\quad \\bar d=\\frac{1}{\\mu-\\lambda},\\quad \\bar w=\\frac{\\lambda}{\\mu(\\mu-\\lambda)}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第4章","starLevel":"★★★★★","cardType":"计算","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S058","question":"**用户均衡（Wardrop第一原理）**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"任何OD对之间，被使用路径的出行时间相等，未被使用路径的出行时间大于或等于被使用路径","chapter":"第4章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D8","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S059","question":"**道路通行能力**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"在一定条件下，每小时内能通过车道、道路中某一点或均匀断面的最大交通量","chapter":"第5章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S060","question":"**基本通行能力**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"理想条件下，道路组成部分一条车道或一车行道均匀段上或一横断面上，1h能通过标准车辆的最大辆数","chapter":"第5章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S061","question":"**可能通行能力**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"实际或预测条件下，一条车道或一车行道均匀段上，1h能通过的最大辆数（混合交通按标准汽车计）","chapter":"第5章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S062","question":"**设计通行能力**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"预测条件下，道路组成部分在选定的设计服务水平下，1h能通过的最大辆数","chapter":"第5章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S063","question":"**车辆换算系数**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"某类车辆一辆在通行能力方面相当于标准车辆的辆数","chapter":"第5章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S064","question":"**换算交通量**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 把混合交通中的各类车辆按换算系数折算为标准车的当量交通量\n\n**核心公式**\n\n$$V_e=V\\sum_i P_iE_i$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第5章","starLevel":"★★★★★","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S065","question":"**道路服务水平**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"交通流中车辆运行以及驾驶员、乘客所感受的质量量度，即道路在某种交通条件下提供运行服务的质量水平","chapter":"第5章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S066","question":"**基本路段**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"主线上不受匝道附近车辆汇合、分离及交织运行影响的路段部分","chapter":"第5章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S067","question":"**基本通行能力公式**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 由最小安全车头时距反算\n- 设计速度120、100、80km/h分别对应2200、2100、2000pcu/(h·ln)\n\n**核心公式**\n\n$$C_0=\\frac{3600}{h}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第5章","starLevel":"★★★★★","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S068","question":"**实际（可能）通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 对基本通行能力按车道数、交通组成、驾驶员、路侧干扰逐项修正\n\n**核心公式**\n\n$$C_A=C_0Nf_{HV}f_pf_f$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第5章","starLevel":"★★★★★","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S069","question":"**交通组成修正系数**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 按各车型占比与折算系数计算\n\n**核心公式**\n\n$$f_{HV}=\\frac{1}{1+\\sum_i P_i(E_i-1)}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第5章","starLevel":"★★★★★","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S070","question":"**设计通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 结合实际服务水平确定\n- 高速公路一般按三级服务水平设计\n\n**核心公式**\n\n$$C_D=C_A\\left(\\frac{V}{C}\\right)_i$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第5章","starLevel":"★★★★★","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S071","question":"**无信号交叉口通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 主要道路交通量与次要道路可穿越车辆数之和，最大等于主要道路路段通行能力\n\n**核心公式**\n\n$$Q_{dx}=\\frac{Q_\\pm e^{-qt_0}}{1-e^{-qt}},\\qquad q=\\frac{Q_\\pm}{3600}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第5章","starLevel":"★★★★★","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S072","question":"**信号交叉口一条直行车道设计通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 由饱和流率、绿灯时间、损失时间与折减系数计算\n\n**核心公式**\n\n$$C_s=\\frac{3600}{\\tau}\\left[\\frac{t_g-t_0}{t_i}+1\\right]\\varphi$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第5章","starLevel":"★★★★★","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S073","question":"**公交线路通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 受沿线各站通行能力制约，最小者控制全线\n- 车站通行能力取决于车辆占用车站时间\n\n**核心公式**\n\n$$C_{\\text{线}}=\\min(C_{\\text{站}})=\\frac{3600}{T}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第5章","starLevel":"★★★★★","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S074","question":"**车辆占用车站时间**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 由进站停车、开关门、乘客上下车、起动离站四段时间组成\n\n**核心公式**\n\n$$T=t_1+t_2+t_3+t_4$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第5章","starLevel":"★★★★★","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S075","question":"**公交车站通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 把四段时间代入并化简\n- 设计通行能力再乘0.8\n- 客运能力＝通行能力×额定容量\n\n**核心公式**\n\n$$C_{\\text{站}}=\\frac{3600}{2.57\\sqrt{l/b}+\\sqrt{l/a}+\\Omega Kt_0/n_d+4}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第5章","starLevel":"★★★★★","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S076","question":"**行人设施通行能力**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"良好天气与道路条件下，行人以均匀速度行走时，单位时间内通过某点或某断面的最大行人数，常用每小时或每分钟通过1m宽道路的行人数表示","chapter":"第5章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S077","question":"**人行道基本通行能力**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 由步速、行人横向间距与前后间距计算\n- 基本通行能力4800人/(h·m)\n\n**核心公式**\n\n$$C_{bw}=\\frac{3600v_p}{s_pb_p}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第5章","starLevel":"★★★★★","cardType":"计算","planDay":"D9","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S078","question":"**重力模型法**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 以行程时间作阻抗，参数用试算法确定，要求现状与预测的加权平均行程时间相对误差不大于3%\n\n**核心公式**\n\n$$T_{ij}=P_i\\frac{A_jf(c_{ij})}{\\sum_j A_jf(c_{ij})},\\qquad f(c)=c^{-\\alpha}e^{-\\beta c}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第6章","starLevel":"★★★★★","cardType":"计算","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S079","question":"**出行时耗与路权**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 路权衡量出行费用\n- 出行时耗为所经路段行驶时间与交叉口进口延误之和\n\n**核心公式**\n\n$$T=\\sum_i t_i+\\sum_j d_j$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第6章","starLevel":"★★★★★","cardType":"计算","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S080","question":"**交通分配**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"把各种出行方式的空间OD量分配到具体交通网络，所得路段与交叉口交通量是检验路网规划合理性的依据","chapter":"第6章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S081","question":"**路段饱和度**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 路段分配交通量与经修正的设计通行能力之比\n\n**核心公式**\n\n$$S_r=\\frac{N_b}{N_a}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第6章","starLevel":"★★★★★","cardType":"计算","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S082","question":"**交通设计**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"以交通工程学理论为指导，分析道路设施与交通流运行的互动关系，综合运用设计技术，制定设施布置与交通流管理方案，优化时空资源、协调路权，实现安全高效运行","chapter":"第7章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S083","question":"**交通设计的特征**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 目标性（以需求为导向定功能目标）、系统性（各子系统相互制约、统筹兼顾求综合最优）、综合性（综合运用交通工程学原理并灵活应用标准规范）","chapter":"第7章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S084","question":"**车道平衡原理**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"交通流在路径转移过程中所拥有的车道数应保持连续的平衡状态；平交口设专用车道且出口道数与该流向最大汇入车道数平衡；路段合流后车道数与合流前平衡","chapter":"第7章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S085","question":"**速度平衡原理**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"交通设计应使不同流向车流在合流或交织过程中速度保持相互接近，以避免或减少交通冲突；应用于加速车道、右转合流车道、公交停靠站、掉头加速车道","chapter":"第7章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S086","question":"**时空资源平衡原理**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"道路时间资源与空间资源相互联系、可相互转化；需据道路条件、交通流状况与环境确定合理通行空间、通行权与规则；如可变导向车道、潮汐车道","chapter":"第7章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S087","question":"**交通管理**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"依据交通法规和政策，运用交通工程科学技术，管理交通系统中的人、车、路和环境，合理引导、限制、组织和指挥交通流","chapter":"第8章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S088","question":"**交通控制**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"运用各种控制软硬设备指挥和控制交通；宏观上交通管理包含交通控制，二者是有机体","chapter":"第8章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S089","question":"**交通管理与控制发展的四个阶段**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 传统管理（建路＋分道限速）\n- 交通系统管理TSM（按需管供）\n- 交通需求管理TDM（按供管需）\n- 智能交通管理（高新技术增加供给能力）","chapter":"第8章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S090","question":"**管理理念的三次转变**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 从“按需增供”转为“按需管供”（TSM），再转为“按供管需”（TDM），核心是认识到增建道路会刺激潜在需求并增加污染","chapter":"第8章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S091","question":"**交通需求管理TDM**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"根据出行动力和时空消耗特性，通过法规政策、信息系统、土地使用开发等，管理控制限制或诱导交通需求，减少出行、降低时空消耗，建立平衡可达的交通系统","chapter":"第8章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S092","question":"**TDM的主要策略**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 优先发展（公交等效率高污染低能耗少的出行方式）、控制发展（效率低污染大能耗高的方式，需分析正负效应）、限制出行（特定时间区域限行，需定量评价）、经济杠杆（拥挤收费与优惠）","chapter":"第8章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S093","question":"**交通系统管理TSM**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"通过改善车辆和道路的管理、运营，更有效地利用现有交通设施；基本原则是不增加或尽可能少增加供给，提高系统容量、效率与安全","chapter":"第8章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S094","question":"**TSM的主要策略**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 节点交通管理（交叉口控制方式与进口拓宽、渠化、配时优化、转向限制）、干线交通管理（单行线、公交专用线、货车禁行、绿波线）、区域交通管理（区域信号控制系统与智能管理）","chapter":"第8章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S095","question":"**标志视认距离**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 视认分发现、识别、认读、理解、行动五个阶段，全过程汽车行驶距离即视认距离\n- 车速越高视认距离越短，需相应调整标志尺寸与字体","chapter":"第8章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S096","question":"**平面交叉口交通管理的目的**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 减少冲突点（单行线、禁左等）、控制相对速度（转弯合流角小于30°）、交通流与公交优先、分离冲突点减小冲突区、选取最佳周期提高绿灯利用率","chapter":"第8章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S097","question":"**交叉口视距三角形**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 用视距三角形分析交叉口视距是否足够\n- 直角边为停车视距，t一般取1s、L₀取2m\n\n**核心公式**\n\n$$L=0.28vt+\\frac{0.004v^2}{\\varphi}+L_0$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第8章","starLevel":"★★★★★","cardType":"计算","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S098","question":"**单向交通**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"又称单行线，道路上车辆只能按一个方向行驶；是解决城市交通拥挤、利用现有路网容量的经济有效措施，适合道路狭窄、路网密度高的区域成对设置","chapter":"第8章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S099","question":"**单向交通的优缺点**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 优点：提高通行能力、减少事故、提高车速\n- 缺点：增加绕行距离与驾驶工作量、公交与步行不便、易迷路、需增加公用设施","chapter":"第8章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S100","question":"**固定周期信号控制参数**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 周期长度（各方向完成一组色灯变换的总时间，按交通量与车种计算）、绿灯时间（按等效交通量分配，用周期减2倍黄灯时间算总绿灯）、绿信比（某相位通行时间与周期之比）","chapter":"第8章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S101","question":"**绿波带**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"车流沿主干道行进时连续得到绿灯信号；实现关键是精确设计相邻交叉口之间的相位差；双向交通干道较难实现绿波带","chapter":"第8章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S102","question":"**交通事故**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"车辆在道路上因过错或意外造成人身伤亡或财产损失的事件；是随机事件，道路安全用事故期望频率与严重程度评价","chapter":"第9章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S103","question":"**事故影响因素的三时段**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 事故前因素影响发生风险（如制动器磨损）、事故时因素影响碰撞严重程度（如气囊展开）、事故后因素影响事故结果（如应急响应与医疗）","chapter":"第9章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S104","question":"**事故致因的人车路环境**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 人（主体，操作失误与违章）、车（约13%事故与车辆有关，制动转向故障漏油）、道路环境（约34%事故与环境有关，几何设计、路面状况、交通设施）","chapter":"第9章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S105","question":"**哈顿矩阵**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"关联事故事件与致因类别，用于确定致因和影响阶段，是选择改善措施的依据","chapter":"第9章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S106","question":"**万车事故率**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 按机动车保有量换算的事故率，用于地区间比较\n\n**核心公式**\n\n$$R_{\\text{万车}}=\\frac{\\text{事故次数}}{\\text{机动车保有量}}\\times10^4$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第9章","starLevel":"★★★★★","cardType":"计算","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S107","question":"**万人事故率**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 按人口换算的事故率\n\n**核心公式**\n\n$$R_{\\text{万人}}=\\frac{\\text{事故次数}}{\\text{人口数}}\\times10^4$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第9章","starLevel":"★★★★★","cardType":"计算","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S108","question":"**亿车公里事故率**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 按行驶总车公里换算，是路段安全评价最常用的相对指标\n\n**核心公式**\n\n$$R=\\frac{\\text{事故次数}\\times10^8}{AADT\\times365\\times L}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第9章","starLevel":"★★★★★","cardType":"计算","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S109","question":"**交叉口事故率**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"- 按交叉口流入交通量换算\n\n**核心公式**\n\n$$R_{\\text{交叉口}}=\\frac{\\text{年事故件数}\\times10^6}{24\\text{h流入交通量}\\times365}$$\n\n> 答题要求：先写公式，再代入数据，结果必须带单位。","chapter":"第9章","starLevel":"★★★★★","cardType":"计算","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S110","question":"**间接评价法与交通冲突技术**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 缺乏完善事故统计时用替代指标评价\n- 我国多用，交通冲突技术应用最广，以冲突为替代指标，数据获取迅速、评价周期短","chapter":"第9章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S111","question":"**道路交通环境问题**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 环境污染（汽车尾气、交通噪声、光污染、振动污染、生态污染）与资源破坏（土地占用、植被破坏、水土流失、动植物受害）两类","chapter":"第10章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S112","question":"**大气污染**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"大气中物质含量有害，破坏生态和危害人体的现象；污染物来源分天然源与人为源，按性状分固定式与移动式污染源","chapter":"第10章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S113","question":"**主要大气污染物**\n\n> 简答题｜请分点写出踩分关 d":false,"isArchived":false,"note":""},{"id":"T817-S118","question":"**微观交通仿真模型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 描述程度最高，以单个车辆为单元描述交通流，能反映车辆微观行为","chapter":"第11章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S119","question":"**交通仿真的基本步骤**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 明确问题\n- 确定仿真适用性\n- 问题系统化（一级流程图）\n- 数据收集处理\n- 建立数学模型\n- 参数估计\n- 模型评价\n- 编制程序\n- 模型确认\n- 实验设计\n- 结果分析","chapter":"第11章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S120","question":"**智能运输系统ITS**\n\n> 名词解释｜请准确写出定义，关键词不可漏。","answer":"以提升运输效率与安全性、促进可持续发展为目的，运用传感、计算机、电子控制、信息与通信技术，整合交通管理策略，智能化交通运输管理系统","chapter":"第12章","starLevel":"★★★★★","cardType":"名词解释","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S121","question":"**美国ITS架构**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 由制度层、交通层和传输层三个层面组成（交通层为核心层）\n- 由8个一级子系统、30个二级子系统构成","chapter":"第12章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-S122","question":"**ITS的八个一级子系统**\n\n> 简答题｜请分点写出踩分关键词。","answer":"- 出行与交通管理系统、公共交通管理系统、电子支付系统、商用车辆运营管理系统、应急事件管理系统、先进车辆安全系统、信息管理系统、维护与建设管理系统","chapter":"第12章","starLevel":"★★★★★","cardType":"简答","planDay":"D10","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorr rLevel":"★★★★☆","cardType":"简答","planDay":"D1","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M02-011","question":"**汽车的交通特性**\n\n> 简答题｜请分点写出踩分关键词。","answer":"含设计车辆尺寸（外廓尺寸界限）、动力性能（最高车速、加速时间、最大爬坡能力）、制动性能（制动距离、减速度、制动效能与方向稳定性）","chapter":"第2章","starLevel":"★★★★☆","cardType":"简答","planDay":"D3","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M02-012","question":"**自行车流的交通特性**\n\n> 简答题｜请分点写出踩分关键词。","answer":"群体性、潮汐性、离散性、赶超现象、并肩或并排骑行、不易控制","chapter":"第2章","starLevel":"★★★★☆","cardType":"简答","planDay":"D1","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M02-013","question":"**交通量的表达方式**\n\n> 简答题｜请分点写出踩分关键词。","answer":"通常取某一时段内的平均值作为代表交通量；时段不足1h时计算的平均交通量称为流率","chapter":"第2章","starLevel":"★★★★☆","cardType":"简答","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M02-014","question":"**月平均日交通量与周平均日交通量**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"月平均日交通量为月交通量除以该月天数；周平均日交通量为周交通量除以7\n\n**核心公式**\n\n$$MADT=\\frac{Q_{\\text{月}}}{d_{\\text{月}}},\\qquad WADT=\\frac{Q_{\\text{周}}}{7}$$","chapter":"第2章","starLevel":"★★★★☆","cardType":"计算","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M02-015","question":"**交通量的周变化与日变系数**\n\n> 计算题｜请写出公式、变量含义与计算步骤。","answer":"一周内7天交通量变化曲线为日变图；日变系数为周平均日交通量与观测日交通量之比\n\n**核心公式**\n\n$$K_{\\text{日}}=\\frac{WADT}{Q_{\\text{观测日}}}$$","chapter":"第2章","starLevel":"★★★★☆","cardType":"计算","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M02-016","question":"**交通量的时变化与高峰小时流量比**\n\n> 简答题｜请分点写出踩分关键词。","answer":"一天24h交通量呈马鞍形，上下午各有一高峰；高峰小时交通量占全日交通量之比为高峰小时流量比，我国公路统计为9%~10%、平均9.6%","chapter":"第2章","starLevel":"★★★★☆","cardType":"简答","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M02-017","question":"**交通量的空间分布**\n\n> 简答题｜请分点写出踩分关键词。","answer":"城乡分布（城市高于郊区、近郊高于远郊）、路段分布（绘路网交通量分布图）、方向分布、车道分布","chapter":"第2章","starLevel":"★★★★☆","cardType":"简答","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M02-018","question":"**交通流的主要参数**\n\n> 简答题｜请分点写出踩分关键词。","answer":"流率、速度、驾驶时间、占用率、密度、车头时距、车头间距","chapter":"第2章","starLevel":"★★★★☆","cardType":"简答","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTime":0,"stability":0,"difficulty":5,"reps":0},"isWeakCard":false,"isArchived":false,"note":""},{"id":"T817-M02-019","question":"**交通流测量类型**\n\n> 简答题｜请分点写出踩分关键词。","answer":"点测量（流率、车头时距、速度，用计数器、气动管、感应检测器）、路段测量（双气动管、双地感线圈，测占有率并推算密度）、区间测量（摄像机或航拍，单帧测密度、多帧测速度）","chapter":"第2章","starLevel":"★★★★☆","cardType":"简答","planDay":"D2","reviewInfo":{"nextReviewTimeStamp":0,"continuousCorrect":0,"lastSelfRate":0,"createTime":1762876800000,"lastReviewTim
